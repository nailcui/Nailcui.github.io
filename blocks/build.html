<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<title>作品详情 · 阿基米德积木</title>
<link rel="stylesheet" href="blocks.css">
<style>
  body { overflow-x: hidden; }
  .bd { display: grid; grid-template-columns: minmax(0, 1fr) 408px; height: calc(100vh - 59px); height: calc(100dvh - 59px - env(safe-area-inset-top, 0px)); }
  .stage {
    position: relative; min-height: 0;
    background: radial-gradient(90% 82% at 50% 40%, #fffdf8 0%, #faf3e6 60%, #f2e9d8 100%);
    border-right: 1px solid var(--line);
  }
  .stage .bv { position: absolute; inset: 0; }
  .st-chip {
    position: absolute; left: 16px; top: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 12px; border-radius: 999px; background: rgba(255, 253, 248, .9); border: 1px solid var(--line);
    font-size: 13.5px; color: var(--ink-2); pointer-events: none; box-shadow: 0 2px 8px -4px rgba(84, 64, 38, .22);
  }
  .st-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--pri); }
  .st-chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .st-views {
    position: absolute; right: 16px; top: 14px; z-index: 3; display: flex; gap: 2px; padding: 3px;
    border-radius: 999px; background: rgba(255, 253, 248, .9); border: 1px solid var(--line);
  }
  .st-views button {
    border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2);
    cursor: pointer; min-height: 32px; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .st-views button:hover { background: var(--bg-2); color: var(--ink); }
  .st-ctl { position: absolute; right: 16px; bottom: 16px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .zoom { display: flex; border-radius: 12px; background: rgba(255, 253, 248, .94); border: 1px solid var(--line-2); overflow: hidden; }
  .zoom button {
    width: 44px; height: 42px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .zoom button + button { border-left: 1px solid var(--line); }
  .zoom button:hover { background: var(--bg-2); }
  .zoom svg { width: 19px; height: 19px; }
  .rec {
    display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; border-radius: 12px;
    border: 1px solid var(--line-2); background: rgba(255, 253, 248, .94); cursor: pointer; font-size: 13.5px; color: var(--ink-2);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .rec:hover { background: var(--bg-2); color: var(--ink); }
  .rec svg { width: 17px; height: 17px; }
  .st-hint { position: absolute; left: 16px; bottom: 20px; z-index: 2; margin: 0; font-size: 12.5px; color: var(--ink-3); pointer-events: none; transition: opacity .4s; }

  .panel { min-height: 0; overflow-y: auto; padding: 22px 24px 30px; background: var(--card); -webkit-overflow-scrolling: touch; }
  .crumb { font-size: 13px; color: var(--ink-3); }
  .crumb a { color: var(--ink-3); text-decoration: none; }
  .crumb a:hover { color: var(--pri-d); }
  .ph-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 4px; }
  .ph-row h1 { margin: 0; font-size: 26px; line-height: 1.3; letter-spacing: .01em; flex: 1; min-width: 0; }
  .fav {
    flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line-2); background: var(--card); cursor: pointer; font-size: 13.5px; color: var(--ink-2);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .fav svg { width: 17px; height: 17px; }
  .fav.on { color: var(--clay); border-color: #ecd0c2; background: var(--clay-soft); }
  .fav.on svg path { fill: currentColor; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .intro { margin: 14px 0 0; font-size: 15px; line-height: 1.8; color: var(--ink); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; margin: 18px 0 14px; border-radius: 12px; background: var(--bg-2); }
  .seg button {
    border: 0; background: none; height: 40px; border-radius: 9px; cursor: pointer; font-size: 14.5px; color: var(--ink-2);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 650; box-shadow: 0 1px 3px rgba(84, 64, 38, .16); }

  .card { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 14px; background: #fff; }
  .sc-stage { font-size: 13.5px; color: var(--ink-2); }
  .sc-stage b { color: var(--pri-d); font-weight: 600; }
  .st-picks { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .st-picks button {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px 7px 8px; border-radius: 999px;
    border: 1px solid var(--line-2); background: var(--card); cursor: pointer; font-size: 13.5px; color: var(--ink-2);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .st-picks button:hover { border-color: var(--ink-3); }
  .st-picks button .no {
    width: 24px; height: 24px; border-radius: 50%; background: var(--bg-2); color: var(--ink-3);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none;
  }
  .st-picks button.on { border-color: var(--pri); background: var(--pri-soft); color: var(--pri-d); font-weight: 600; }
  .st-picks button.on .no { background: var(--pri); color: #fff; }
  .ctrl { display: grid; grid-template-columns: 52px 1fr; gap: 10px; margin-top: 14px; }
  .ctrl .ibtn { width: 52px; height: 46px; border-radius: 14px; }
  .ctrl .btn { min-height: 46px; border-radius: 14px; font-size: 15.5px; }
  .sc-count { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--ink-2); flex-wrap: wrap; }
  .sc-count b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sc-count .add { font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--clay-soft); color: #a8512c; line-height: 1.8; }
  .sc-text { margin: 10px 0 0; font-size: 15px; line-height: 1.85; color: var(--ink); }
  .opts { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; user-select: none; min-height: 32px; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch i { width: 36px; height: 21px; border-radius: 999px; background: #ddd2bd; position: relative; transition: background .15s; flex: none; }
  .switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
  .switch input:checked + i { background: var(--pri); }
  .switch input:checked + i::after { transform: translateX(15px); }
  .switch input:focus-visible + i { outline: 2.5px solid var(--pri); outline-offset: 2px; }
  .full-act { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .full-act .btn { flex: 1; min-width: 150px; }
  .sum { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 14px 0 2px; font-size: 14px; color: var(--ink-2); }
  .sum span { display: inline-flex; align-items: center; gap: 5px; }

  .sect { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
  .sect > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 16px; font-weight: 650; font-size: 15px; -webkit-tap-highlight-color: transparent;
  }
  .sect > summary::-webkit-details-marker { display: none; }
  .sect > summary span { font-weight: 400; color: var(--ink-3); font-size: 13px; margin-left: auto; }
  .sect > summary::after {
    content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3);
    transform: rotate(45deg) translateY(-2px); transition: transform .15s; flex: none;
  }
  .sect[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
  .nlist { margin: 0; padding: 2px 18px 14px; }
  .nlist li { margin: 8px 0; padding-left: 16px; position: relative; font-size: 14px; line-height: 1.8; color: var(--ink-2); }
  .nlist li::before { content: ""; position: absolute; left: 0; top: .72em; width: 7px; height: 7px; border-radius: 2px; background: var(--wood); }
  .verify { margin: 16px 2px 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.75; }
  .missing { max-width: 420px; margin: 80px auto; text-align: center; padding: 0 20px; }

  @media (max-width: 959px) {
    .top { position: relative; }
    .bd { display: block; height: auto; }
    .stage { position: sticky; top: 0; z-index: 5; height: 42vh; height: clamp(240px, 42svh, 420px); border-right: 0; border-bottom: 1px solid var(--line); }
    .panel { overflow: visible; height: auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
    .ph-row h1 { font-size: 21px; }
    .fav { height: 34px; padding: 0 12px; }
    .seg { margin: 12px 0 10px; }
    .seg button { height: 36px; }
    .card { padding: 14px 14px 12px; }
    .st-chip { left: 10px; top: 10px; font-size: 12.5px; padding: 5px 11px 5px 10px; }
    .st-views { right: 10px; top: 10px; }
    .st-views button { padding: 5px 10px; font-size: 12.5px; }
    .st-ctl { right: 10px; bottom: 10px; gap: 6px; }
    .zoom button { width: 40px; height: 40px; }
    .rec { height: 40px; padding: 0 11px; font-size: 12.5px; }
    .st-hint { left: 12px; top: 52px; bottom: auto; font-size: 11.5px; }
    .crumb { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2.5" y="23" width="27" height="6" rx="1.6" fill="#d9b98a" stroke="#a97f4c" stroke-width="1.4"/>
        <rect x="13" y="10" width="6" height="13" rx="1.6" fill="#c9a575" stroke="#a97f4c" stroke-width="1.4"/>
        <rect x="6.5" y="3.5" width="19" height="6" rx="1.6" fill="#e6cba2" stroke="#a97f4c" stroke-width="1.4"/>
      </svg>
      <span><b>阿基米德积木</b><small>创意搭建 · 作品库</small></span>
    </a>
    <nav class="nav">
      <a href="library.html">作品库</a>
      <a class="home" href="../" title="回到博客主页">←<span> 主页</span></a>
    </nav>
  </div>
</header>

<main class="bd" id="bd">
  <section class="stage" aria-label="3D 模型">
    <div class="bv" id="bv"><div class="bv-loading" id="loading">正在准备 3D 模型…</div></div>
    <div class="st-chip" id="stChip" hidden><i></i><span id="stChipText"></span></div>
    <div class="st-views" role="group" aria-label="快捷视角">
      <button type="button" data-view="iso">立体</button>
      <button type="button" data-view="front">正面</button>
      <button type="button" data-view="side">侧面</button>
      <button type="button" data-view="top">俯视</button>
    </div>
    <p class="st-hint" id="stHint">拖动旋转 · 滚轮或双指缩放</p>
    <div class="st-ctl">
      <button type="button" class="rec" id="recBtn" title="转到这一阶段的推荐观察角度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>推荐角度</span>
      </button>
      <button type="button" class="rec" id="rotBtn" aria-pressed="false" title="自动旋转">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <div class="zoom" role="group" aria-label="缩放">
        <button type="button" id="zOut" aria-label="缩小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button type="button" id="zReset" aria-label="复位视角" title="复位视角"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
        <button type="button" id="zIn" aria-label="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
    </div>
  </section>

  <aside class="panel" id="panel">
    <div class="crumb"><a href="library.html">作品库</a> / <a id="crumbCat" href="library.html"></a></div>
    <div class="ph-row">
      <h1 id="title"></h1>
      <button type="button" class="fav" id="favBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.2 4.5c2 0 3.4 1.1 4.8 2.8 1.4-1.7 2.8-2.8 4.8-2.8 3.6 0 5.8 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span>收藏</span>
      </button>
    </div>
    <div class="meta" id="meta"></div>
    <p class="intro" id="intro"></p>

    <div class="seg" role="tablist" aria-label="展示方式">
      <button type="button" role="tab" data-mode="full" id="modeFull">完整作品</button>
      <button type="button" role="tab" data-mode="stage" id="modeStage">关键阶段</button>
    </div>

    <section class="card" id="fullCard">
      <div class="sum" id="sum"></div>
      <div class="full-act">
        <button type="button" class="btn" id="startBtn">看关键阶段</button>
      </div>
    </section>

    <section class="card" id="stageCard" hidden>
      <div class="sc-stage" id="scStage"></div>
      <div class="st-picks" id="stPicks" role="group" aria-label="选择关键阶段"></div>
      <!-- 控制按钮放在说明文字上方：说明长短变化时按钮位置不跳动 -->
      <div class="ctrl">
        <button type="button" class="ibtn" id="prevBtn" aria-label="上一阶段"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button type="button" class="btn" id="nextBtn">下一阶段</button>
      </div>
      <div class="sc-count" id="scCount"></div>
      <p class="sc-text" id="scText" aria-live="polite"></p>
      <div class="opts">
        <label class="switch"><input type="checkbox" id="fadeChk"><i></i>淡化已有部分</label>
        <label class="switch"><input type="checkbox" id="focusChk"><i></i>聚焦新增部分</label>
      </div>
    </section>

    <details class="sect" id="notesSect">
      <summary>结构说明<span id="notesCount"></span></summary>
      <ul class="nlist" id="notes"></ul>
    </details>
    <p class="verify" id="verify"></p>
  </aside>
</main>

<script src="three.min.js"></script>
<script src="blocks-core.js"></script>
<script src="blocks-models.js"></script>
<script src="blocks3d.js"></script>
<script src="blocks-ui.js"></script>
<script>
(function () {
  'use strict';
  var C = BlocksCore, M = BlocksModels, $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var model = M.get(qs.get('id') || 'tower');
  if (!model) {
    $('bd').innerHTML = '<div class="missing"><p style="font-size:40px;margin:0">🪵</p><h1 style="font-size:20px">没有找到这件作品</h1>' +
      '<p style="color:var(--ink-3)">可能链接有误，去作品库重新挑一件吧。</p><a class="btn" href="library.html">打开作品库</a></div>';
    return;
  }
  var N = model.count, NS = model.stages.length;
  var desktop = window.matchMedia('(min-width: 960px)');
  var startStage = Math.max(0, Math.min(NS - 1, (+qs.get('stage') || 1) - 1));

  document.title = model.name + ' · 阿基米德积木';
  $('title').textContent = model.name;
  $('crumbCat').textContent = C.CATS[model.cat].icon + ' ' + C.CATS[model.cat].name;
  $('crumbCat').href = 'library.html?cat=' + model.cat;
  $('meta').innerHTML =
    '<span class="tag lv' + model.level + '">' + C.LEVELS[model.level] + '</span>' +
    '<span class="tag wood">' + N + ' 根木条</span>' +
    '<span class="tag">' + C.CATS[model.cat].name + '</span>' +
    '<span class="tag">' + NS + ' 个关键阶段</span>' +
    '<span class="tag">成品 ' + C.dimsText(model) + '</span>';
  $('intro').textContent = model.intro;
  $('sum').innerHTML =
    '<span>🪵 木条 <b>' + N + '</b> 根（规格统一 15 : 3 : 1）</span>' +
    '<span>📐 成品 <b>' + C.dimsText(model) + '</b>（由模型包围盒计算）</span>' +
    '<span>🧗 难度 <b>' + C.LEVELS[model.level] + '</b></span>';
  $('notes').innerHTML = model.notes.map(function (s) { return '<li>' + C.esc(s) + '</li>'; }).join('');
  $('notesCount').textContent = model.notes.length + ' 条';
  $('verify').textContent = '结构说明：每根木条规格一致（120 × 24 × 8 mm），未经缩放或切割；已做几何相交、悬空与承托关系检查，' +
    '每个阶段独立成立。但未做物理仿真，也未经实物承重测试——实际稳定性与木条摩擦、桌面平整度有关，搭建时请轻拿轻放。';

  /* ---------- 状态 ---------- */
  var state = { mode: qs.get('stage') != null ? 'stage' : 'full', stage: startStage, fade: false, focus: false };

  /* ---------- 3D ---------- */
  var viewer = BlocksView.create($('bv'), model, { onReady: function () { var l = $('loading'); if (l) l.remove(); } });
  if (viewer.ok) $('stChip').hidden = false;
  else document.querySelectorAll('.st-views,.st-ctl,.st-hint').forEach(function (el) { el.hidden = true; });
  if (BlocksView.COARSE) $('stHint').textContent = '单指旋转 · 双指缩放';
  viewer.onInteract = function () { $('stHint').style.opacity = '0'; };
  viewer.onReset = function () {
    state.focus = false;
    $('focusChk').checked = false;
    $('rotBtn').setAttribute('aria-pressed', 'false');
    $('rotBtn').style.color = ''; $('rotBtn').style.borderColor = '';
    viewer.setAutoRotate(false);
  };

  /* ---------- 渲染面板 ---------- */
  function render() {
    var full = state.mode === 'full', sg = model.stages[state.stage];
    $('modeFull').classList.toggle('on', full);
    $('modeStage').classList.toggle('on', !full);
    $('modeFull').setAttribute('aria-selected', full);
    $('modeStage').setAttribute('aria-selected', !full);
    $('fullCard').hidden = !full;
    $('stageCard').hidden = full;
    $('recBtn').hidden = !viewer.ok;
    $('stChipText').innerHTML = full
      ? '完整作品 · <b>' + N + '</b> 根'
      : '阶段 <b>' + (state.stage + 1) + ' / ' + NS + '</b> · ' + C.esc(sg.title);

    if (!full) {
      $('scStage').innerHTML = '阶段 ' + (state.stage + 1) + '/' + NS + ' · <b>' + C.esc(sg.title) + '</b>';
      $('stPicks').innerHTML = model.stages.map(function (s, i) {
        return '<button type="button" data-st="' + i + '"' + (i === state.stage ? ' class="on"' : '') + '>' +
          '<span class="no">' + (i + 1) + '</span>' + C.esc(s.title) + '</button>';
      }).join('');
      $('scCount').innerHTML =
        '<span class="add">本阶段 +' + sg.count + ' 根</span>' +
        '<span>截至本阶段 <b>' + sg.upto + '</b> / ' + N + ' 根</span>';
      $('scText').textContent = sg.desc;
      $('prevBtn').disabled = state.stage <= 0;
      var last = state.stage >= NS - 1;
      $('nextBtn').disabled = last;
      $('nextBtn').textContent = last ? '已完成 ✓' : '下一阶段';
    }
    $('fadeChk').checked = state.fade;
    $('focusChk').checked = state.focus;
    viewer.set({ mode: state.mode, stage: state.stage, fade: state.fade, focus: state.focus, pulse: true });
  }

  /* ---------- 操作 ---------- */
  var saveT = 0;
  function persist() {
    clearTimeout(saveT);
    saveT = setTimeout(function () { C.touchRecent(model.id, state.mode === 'stage' ? state.stage : null); }, 300);
  }
  function go(i) {
    state.stage = Math.max(0, Math.min(NS - 1, i));
    state.mode = 'stage';
    render();
    persist();
    if (!desktop.matches) $('stageCard').scrollIntoView({ behavior: BlocksView.REDUCED ? 'auto' : 'smooth', block: 'nearest' });
  }
  function setMode(m) {
    if (m === state.mode) return;
    state.mode = m;
    render();
    persist();
  }

  $('modeFull').onclick = function () { setMode('full'); };
  $('modeStage').onclick = function () { setMode('stage'); };
  $('startBtn').onclick = function () { setMode('stage'); };
  $('prevBtn').onclick = function () { go(state.stage - 1); };
  $('nextBtn').onclick = function () { go(state.stage + 1); };
  $('stPicks').addEventListener('click', function (e) {
    var b = e.target.closest('[data-st]');
    if (b) go(+b.dataset.st);
  });
  $('fadeChk').onchange = function () { state.fade = this.checked; viewer.set({ fade: state.fade }); };
  $('focusChk').onchange = function () { state.focus = this.checked; viewer.set({ focus: state.focus }); };
  $('rotBtn').onclick = function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on);
    this.style.color = on ? 'var(--pri-d)' : '';
    this.style.borderColor = on ? 'var(--pri)' : '';
    viewer.setAutoRotate(on);
  };
  document.querySelectorAll('[data-view]').forEach(function (b) { b.onclick = function () { viewer.view(b.dataset.view); }; });
  $('zIn').onclick = function () { viewer.zoom(1); };
  $('zOut').onclick = function () { viewer.zoom(-1); };
  $('zReset').onclick = function () { viewer.reset(); };
  $('recBtn').onclick = function () {
    var sg = model.stages[state.stage];
    viewer.recommended(state.mode === 'stage' && sg && sg.view ? sg.view : model.view);
  };

  function syncFav() {
    var on = C.isFav(model.id);
    $('favBtn').classList.toggle('on', on);
    $('favBtn').setAttribute('aria-pressed', on);
    $('favBtn').querySelector('span').textContent = on ? '已收藏' : '收藏';
  }
  $('favBtn').onclick = function () { C.toggleFav(model.id); syncFav(); };
  syncFav();

  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(state.stage + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.stage - 1); }
  });

  // 结构说明：桌面默认展开，手机默认折叠
  function syncDetails() { $('notesSect').open = desktop.matches; }
  syncDetails();
  desktop.addEventListener && desktop.addEventListener('change', syncDetails);

  render();
  C.touchRecent(model.id, state.mode === 'stage' ? state.stage : null);
  window.__blocks = { model: model, state: state, viewer: viewer, go: go, setMode: setMode };
})();
</script>
</body>
</html>
