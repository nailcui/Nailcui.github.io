<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1420">
  <meta name="description" content="世界迷雾 —— 走过的城市，正在点亮。">
  <title>世界迷雾 · Nailcui</title>
  <style>
    :root {
      --bg: #0a1420;
      --ink: #e8f6f3;
      --acc: #4df0d8;
      --acc2: #8cf7e8;
      --glass: rgba(10, 22, 34, 0.72);
      --line: rgba(77, 240, 216, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    #stage { position: relative; width: 100%; height: 100vh; height: 100dvh; }
    /* 全部内容由一块画布绘制：底图、光效、交互都在它上面 */
    #fx {
      position: absolute; inset: 0; touch-action: none; cursor: grab;
      pointer-events: auto;
    }
    #fx.dragging { cursor: grabbing; }
    #fx.hover-city, #fx.hover-node { cursor: pointer; }

    /* ---------- HUD ---------- */
    .hud { position: absolute; z-index: 1100; }
    .hud-top {
      top: 0; left: 0; right: 0;
      display: flex; align-items: flex-start; gap: 12px;
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
      pointer-events: none;
    }
    .back {
      display: inline-flex; align-items: center; height: 32px; padding: 0 14px;
      border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.16);
      background: var(--glass); color: var(--ink); text-decoration: none;
      font-size: 13px; backdrop-filter: blur(8px); pointer-events: auto;
      transition: border-color 0.25s, color 0.25s; white-space: nowrap;
    }
    .back:hover { border-color: var(--line); color: var(--acc2); }
    .brand h1 {
      font-size: 17px; font-weight: 600; letter-spacing: 0.35em;
      text-shadow: 0 0 18px rgba(77, 240, 216, 0.35);
    }
    .brand p { font-size: 11px; opacity: 0.62; margin-top: 3px; letter-spacing: 0.12em; }
    .stats {
      margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap;
      justify-content: flex-end;
    }
    .stats span {
      display: inline-flex; align-items: center; height: 26px; padding: 0 11px;
      border-radius: 999px; background: var(--glass);
      border: 1px solid rgba(255, 255, 255, 0.12); font-size: 12px;
      color: #cfeee8; backdrop-filter: blur(8px); white-space: nowrap;
    }
    .stats b { color: var(--acc2); font-weight: 600; margin: 0 2px; }

    .mode-switch {
      bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 2px; padding: 4px; border-radius: 999px;
      background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    .mode-switch button {
      appearance: none; border: 0; background: transparent; color: #bfe6df;
      font-size: 13px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
      white-space: nowrap; letter-spacing: 0.05em; font-family: inherit;
    }
    .mode-switch button:hover { color: var(--acc2); }
    .mode-switch button.active {
      background: rgba(77, 240, 216, 0.16); color: var(--acc2);
      box-shadow: inset 0 0 0 1px var(--line), 0 0 18px rgba(77, 240, 216, 0.18);
    }

    .credit {
      bottom: calc(env(safe-area-inset-bottom, 0px) + 5px);
      left: 50%; transform: translateX(-50%);
      font-size: 10px; color: rgba(210, 235, 230, 0.42); letter-spacing: 0.06em;
      pointer-events: none; white-space: nowrap;
    }

    /* ---------- 城市卡片 / 悬停提示 ---------- */
    #cardLayer { position: absolute; inset: 0; z-index: 1300; pointer-events: none; }
    .demo-card-wrap {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: auto;
    }
    .city-card {
      position: relative; width: min(280px, 80vw);
      background: linear-gradient(160deg, rgba(12, 26, 40, 0.95), rgba(8, 18, 28, 0.95));
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 15px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 0 24px rgba(77, 240, 216, 0.12);
      backdrop-filter: blur(10px); font-size: 13px; color: var(--ink);
    }
    .cc-close {
      position: absolute; top: 6px; right: 8px; width: 26px; height: 26px;
      border: 0; background: transparent; color: #9dc4bd; font-size: 18px;
      line-height: 1; cursor: pointer; border-radius: 8px;
    }
    .cc-close:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .cc-kicker { font-size: 11px; letter-spacing: 0.18em; color: var(--acc); opacity: 0.9; margin-bottom: 6px; }
    .cc-name {
      font-size: 20px; font-weight: 600; letter-spacing: 0.12em; margin-bottom: 8px;
      text-shadow: 0 0 14px rgba(77, 240, 216, 0.35);
    }
    .cc-date { font-size: 12px; color: #bfe0da; }
    .cc-note { font-size: 12px; color: #93b8b1; line-height: 1.6; margin-top: 7px; }
    #tooltip {
      position: absolute; z-index: 1350; pointer-events: none;
      transform: translate(-50%, -160%);
      background: rgba(8, 18, 28, 0.92); border: 1px solid var(--line);
      color: #dffef7; font-size: 12px; padding: 5px 10px; border-radius: 8px;
      white-space: nowrap; letter-spacing: 0.04em;
      opacity: 0; transition: opacity 0.15s;
    }
    #tooltip.show { opacity: 1; }
    #tooltip b { color: var(--acc2); font-weight: 600; }

    /* ---------- 移动端 ---------- */
    @media (max-width: 640px) {
      .hud-top { gap: 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
      .back { height: 30px; padding: 0 11px; font-size: 12px; }
      .brand h1 { font-size: 15px; letter-spacing: 0.28em; }
      .brand p { display: none; }
      .stats span { height: 24px; padding: 0 9px; font-size: 11px; }
      .stats .chip-extra { display: none; }
      .mode-switch { max-width: calc(100vw - 24px); }
      .mode-switch button { padding: 8px 13px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body data-mode="neon">
  <div id="stage">
    <canvas id="fx"></canvas>

    <header class="hud hud-top">
      <a class="back" href="./index.html">‹ 返回</a>
      <div class="brand">
        <h1>世界迷雾</h1>
        <p>走过的城市，正在点亮</p>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <div class="hud mode-switch" id="modeSwitch" role="tablist" aria-label="点亮样式切换">
      <button type="button" data-mode="neon" role="tab">✦ 霓虹光圈</button>
      <button type="button" data-mode="fog" role="tab">◈ 迷雾探索</button>
      <button type="button" data-mode="pulse" role="tab">✧ 星火脉冲</button>
    </div>

    <div class="hud credit">示意地图 · 边界数据源自高德系（DataV.GeoAtlas）· 仅供参考</div>
    <div id="cardLayer"><div id="tooltip"></div></div>
  </div>

  <script src="./fog-china.js"></script>
  <script src="./fog-cities.js"></script>
  <script src="./fog-data.js"></script>
  <script src="./fog-trails.js"></script>
  <script>
  (function () {
    'use strict';

    /* ================= 基础数据 ================= */
    var MODES = ['neon', 'fog', 'pulse'];
    var cfg = window.FOG_CONFIG || {};
    var CITIES = (window.FOG_CITIES || []).slice().sort(function (a, b) {
      return String(a.date || '9999').localeCompare(String(b.date || '9999'));
    });
    var CHINA = window.FOG_CHINA || { features: [] };
    var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 行迹图层（fog-trails.js）：与 track.html 的 FOG_ROUTES 同构，但数据独立
    var TRAILS = (window.FOG_TRAILS || []).map(function (r) {
      return {
        id: String(r.id || ''),
        name: String(r.name || r.id || '轨迹'),
        tag: String(r.tag || r.name || ''),
        color: /^#[0-9a-fA-F]{6}$/.test(r.color) ? r.color : '#5fd68b',
        pts: (r.points || []).map(function (p) {
          return { lng: +p[0], lat: +p[1], name: p.length > 2 ? String(p[2]) : '' };
        }).filter(function (p) { return isFinite(p.lng) && isFinite(p.lat); })
      };
    }).filter(function (r) { return r.id && r.pts.length >= 2; });

    var stage = document.getElementById('stage');
    var fx = document.getElementById('fx');
    var ctx = fx.getContext('2d');
    var statsEl = document.getElementById('stats');
    var cardLayer = document.getElementById('cardLayer');
    var tooltip = document.getElementById('tooltip');

    var mode = MODES.indexOf(cfg.style) >= 0 ? cfg.style : 'neon';
    try {
      // 键名带版本号：默认样式变更时递增，让新默认值对老访客生效一次
      var saved = localStorage.getItem('fog:mode:2');
      if (saved && MODES.indexOf(saved) >= 0) mode = saved;
    } catch (e) { /* 隐私模式下 localStorage 不可用 */ }

    var dpr = 1;
    var rafId = 0;
    var activeCity = null;
    var cardWrap = null;

    /* ================= 底图几何 =================
     * 中国省级边界 + 九段线（内嵌自绘，无外部底图、无行政区划绘制风险面）。
     * 基准投影：等经纬示意投影（经向按中纬度收缩），整图缩放平移由 view 控制。 */
    var bbox = { lng0: 73, lng1: 135.5, lat0: 3.5, lat1: 53.8 };
    (function () {
      var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      eachRing(CHINA.features, function (pt) {
        if (pt[0] < x0) x0 = pt[0]; if (pt[0] > x1) x1 = pt[0];
        if (pt[1] < y0) y0 = pt[1]; if (pt[1] > y1) y1 = pt[1];
      });
      if (x1 > x0 && y1 > y0) bbox = { lng0: x0, lng1: x1, lat0: y0, lat1: y1 };
    })();
    var LATK = Math.cos((bbox.lat0 + bbox.lat1) / 2 * Math.PI / 180);
    var BASEW = 1000;
    var BASEK = BASEW / ((bbox.lng1 - bbox.lng0) * LATK);
    var W = (bbox.lng1 - bbox.lng0) * LATK * BASEK;
    var H = (bbox.lat1 - bbox.lat0) * BASEK;

    function eachGeom(g, fn) {
      // 遍历 Polygon/MultiPolygon 的每个环、LineString/MultiLineString 的每条线
      if (!g) return;
      var t = g.type, c = g.coordinates || [];
      if (t === 'Polygon') eachRingOf(c, fn);
      else if (t === 'MultiPolygon') c.forEach(function (p) { eachRingOf(p, fn); });
      else if (t === 'LineString') fn(c);
      else if (t === 'MultiLineString') c.forEach(fn);
    }
    function eachRingOf(polys, fn) { polys.forEach(function (ring) { fn(ring); }); }
    function eachRing(features, fn) {
      features.forEach(function (f) { eachGeom(f.geometry, fn); });
    }

    // 底图 Path2D：陆地填充+描边共用一条路径（evenodd 处理孔洞），九段线单独描边
    var chinaPath = new Path2D();
    var jdPath = new Path2D();
    (function () {
      function eachPolygonRing(g, fn) {
        if (g.type === 'Polygon') g.coordinates.forEach(fn);
        else if (g.type === 'MultiPolygon') g.coordinates.forEach(function (poly) { poly.forEach(fn); });
      }
      CHINA.features.forEach(function (f) {
        var g = f.geometry;
        if (!g) return;
        var isJd = f.properties && f.properties.adcode === '100000_JD';
        if (g.type === 'LineString') {
          tracePath(jdPath, g.coordinates);
        } else if (g.type === 'MultiLineString') {
          g.coordinates.forEach(function (l) { tracePath(jdPath, l); });
        } else if (isJd) {
          // 九段线各段以细长多边形存储：只描边、不填充
          eachPolygonRing(g, function (ring) { tracePath(jdPath, ring); });
        } else {
          eachPolygonRing(g, function (ring) { tracePath(chinaPath, ring); });
        }
      });
      function tracePath(path, ring) {
        for (var i = 0; i < ring.length; i++) {
          var b = proj(ring[i][0], ring[i][1]);
          if (i === 0) path.moveTo(b.x, b.y); else path.lineTo(b.x, b.y);
        }
        path.closePath();
      }
    })();

    function proj(lng, lat) {
      return { x: (lng - bbox.lng0) * LATK * BASEK, y: (bbox.lat1 - lat) * BASEK };
    }

    function traceRing(path, ring) {
      for (var i = 0; i < ring.length; i++) {
        var b = proj(ring[i][0], ring[i][1]);
        if (i === 0) path.moveTo(b.x, b.y); else path.lineTo(b.x, b.y);
      }
      path.closePath();
    }

    // 点亮城市的市域轮廓 Path2D（按 adcode 关联 fog-cities.js）
    var CITY_SHAPES = window.FOG_CITY_SHAPES || {};
    CITIES.forEach(function (c) {
      var sh = CITY_SHAPES[String(c.adcode)];
      if (!sh || !sh.polys) return;
      var path = new Path2D();
      sh.polys.forEach(function (poly) {
        poly.forEach(function (ring) { traceRing(path, ring); });
      });
      c._shapePath = path;
    });

    /* ================= 视图（平移 / 缩放） ================= */
    var view = { s: 1, tx: 0, ty: 0, minS: 0.2, maxS: 8 };
    var viewDirty = false; // 用户手动缩放/平移过后，尺寸变化不再重置视野

    function computeZoomBounds() {
      var pad = Math.min(stage.clientWidth, stage.clientHeight) * 0.07 + 12;
      view.minS = Math.min(
        (stage.clientWidth - 2 * pad) / W,
        (stage.clientHeight - 2 * pad) / H
      );
      view.maxS = view.minS * 10;
    }

    function fitView() {
      computeZoomBounds();
      view.s = view.minS;
      view.tx = (stage.clientWidth - W * view.s) / 2;
      view.ty = (stage.clientHeight - H * view.s) / 2;
    }

    function clampPan() {
      var ww = W * view.s, wh = H * view.s;
      var sw = stage.clientWidth, sh = stage.clientHeight, m = 40;
      if (ww <= sw) view.tx = (sw - ww) / 2;
      else view.tx = Math.min(Math.max(view.tx, sw - ww - m), m);
      if (wh <= sh) view.ty = (sh - wh) / 2;
      else view.ty = Math.min(Math.max(view.ty, sh - wh - m), m);
    }

    function zoomAt(cx, cy, factor) {
      var ns = Math.min(Math.max(view.s * factor, view.minS), view.maxS);
      var k = ns / view.s;
      view.tx = cx - (cx - view.tx) * k;
      view.ty = cy - (cy - view.ty) * k;
      view.s = ns;
      viewDirty = true;
      clampPan();
      scheduleRedraw();
    }

    // 经纬度 → 容器 CSS 像素
    function cssXY(lng, lat) {
      var b = proj(lng, lat);
      return { x: b.x * view.s + view.tx, y: b.y * view.s + view.ty };
    }
    function canvasXY(lng, lat) {
      var p = cssXY(lng, lat);
      return { x: p.x * dpr, y: p.y * dpr };
    }

    /* ================= 工具函数 ================= */
    function hasCoords(c) { return isFinite(c.lng) && isFinite(c.lat); }

    // 轨迹主色 → rgba / 提亮（文字用）
    function hexRGB(hex) {
      var n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function rgba(hex, a) {
      var c = hexRGB(hex);
      return 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', ' + a + ')';
    }
    function mixWhite(hex, k) {
      var c = hexRGB(hex).map(function (v) { return Math.round(v + (255 - v) * k); });
      return 'rgb(' + c[0] + ', ' + c[1] + ', ' + c[2] + ')';
    }

    function daysSince(dateStr) {
      var t = Date.parse(dateStr + 'T00:00:00');
      if (isNaN(t)) return null;
      return Math.max(0, Math.floor((Date.now() - t) / 86400000));
    }

    function sizeFx() {
      var w = stage.clientWidth, h = stage.clientHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      fx.width = Math.max(1, Math.round(w * dpr));
      fx.height = Math.max(1, Math.round(h * dpr));
      fx.style.width = w + 'px';
      fx.style.height = h + 'px';
    }

    /* ================= HUD ================= */
    function buildStats() {
      var provs = {}, latest = null;
      CITIES.forEach(function (c) {
        provs[c.province || '未知'] = 1;
        if (c.date && (!latest || c.date > latest)) latest = c.date;
      });
      statsEl.innerHTML = '';
      addChip('已点亮 <b>' + CITIES.length + '</b> 城');
      addChip('<b>' + Object.keys(provs).length + '</b> 省级地区', 'chip-extra');
      if (latest) addChip('最近 <b>' + latest + '</b>', 'chip-extra');
      function addChip(html, extra) {
        var s = document.createElement('span');
        if (extra) s.className = extra;
        s.innerHTML = html;
        statsEl.appendChild(s);
      }
    }

    function buildModeSwitch() {
      var btns = document.getElementById('modeSwitch').querySelectorAll('button');
      Array.prototype.forEach.call(btns, function (b) {
        b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); });
      });
      syncModeButtons();
    }
    function syncModeButtons() {
      var btns = document.getElementById('modeSwitch').querySelectorAll('button');
      Array.prototype.forEach.call(btns, function (b) {
        var on = b.getAttribute('data-mode') === mode;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    /* ================= 渲染 ================= */
    function needRaf() {
      // 脉冲波纹与轨迹流动光段都需要连续帧（reduced-motion 时全部静态）
      return !reduceMotion && (mode === 'pulse' || TRAILS.length > 0);
    }

    function loop(t) {
      rafId = 0;
      draw(t || 0);
      if (needRaf()) rafId = requestAnimationFrame(loop);
    }

    // 事件驱动的重绘：同步立即绘制（交互零延迟），脉冲动画再交给 rAF 连续帧
    function scheduleRedraw() {
      draw(performance.now());
      if (needRaf() && !rafId) rafId = requestAnimationFrame(loop);
    }

    function draw(t) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      // 背景渐变
      var bg = ctx.createRadialGradient(
        fx.width / 2, fx.height * 0.42, 0,
        fx.width / 2, fx.height * 0.42, Math.max(fx.width, fx.height) * 0.75
      );
      bg.addColorStop(0, '#0e1c2b');
      bg.addColorStop(1, '#070d14');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, fx.width, fx.height);

      // 世界坐标系：底图 + 经纬网 + 点亮市域
      ctx.save();
      ctx.setTransform(view.s * dpr, 0, 0, view.s * dpr, view.tx * dpr, view.ty * dpr);
      drawGraticule();
      if (CHINA.features.length) {
        ctx.fillStyle = '#0f1e2c';
        ctx.fill(chinaPath, 'evenodd');
        ctx.lineWidth = 1 / view.s;
        ctx.strokeStyle = 'rgba(120, 210, 200, 0.16)';
        ctx.stroke(chinaPath);
        ctx.lineWidth = 1.3 / view.s;
        ctx.strokeStyle = 'rgba(110, 220, 205, 0.4)';
        ctx.stroke(jdPath);
      }
      drawLitShapes();
      ctx.restore();

      // 光效（屏幕像素尺度，缩放下观感一致）
      if (mode === 'fog') drawFog();
      else if (mode === 'pulse') drawPulse(t || 0);
      else drawNeon();

      // 行迹图层置于最上：迷雾模式下路线也保持可见
      drawTrails(t || 0);
    }

    function drawGraticule() {
      ctx.strokeStyle = 'rgba(120, 200, 220, 0.05)';
      ctx.lineWidth = 1 / view.s;
      var lng, lat, a, b;
      var lngA = bbox.lng0 - 30, lngB = bbox.lng1 + 30;
      var latA = Math.max(bbox.lat0 - 12, -75), latB = Math.min(bbox.lat1 + 12, 80);
      for (lng = Math.ceil(lngA / 5) * 5; lng <= lngB; lng += 5) {
        a = proj(lng, latB); b = proj(lng, latA);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      for (lat = Math.ceil(latA / 5) * 5; lat <= latB; lat += 5) {
        a = proj(lngA, lat); b = proj(lngB, lat);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }

    function drawNameLabel(c, p) {
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4 * dpr;
      ctx.fillStyle = '#d9f7f0';
      ctx.font = (11 * dpr) + 'px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(c.name, p.x, p.y + 22 * dpr);
      ctx.shadowBlur = 0;
    }

    // 点亮城市的市域高亮（霓虹/脉冲直接可见；迷雾模式下先绘制，被暗幕覆盖后随挖空透出）
    function drawLitShapes() {
      var fill, stroke;
      if (mode === 'neon') { fill = 'rgba(41, 222, 205, 0.32)'; stroke = 'rgba(140, 247, 232, 0.7)'; }
      else if (mode === 'fog') { fill = 'rgba(41, 222, 205, 0.2)'; stroke = 'rgba(140, 247, 232, 0.5)'; }
      else { fill = 'rgba(41, 222, 205, 0.26)'; stroke = 'rgba(140, 247, 232, 0.6)'; }
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.1 / view.s;
      CITIES.forEach(function (c) {
        if (!c._shapePath) return;
        ctx.fill(c._shapePath, 'evenodd');
        ctx.stroke(c._shapePath);
      });
    }

    // 城市中心点标记（克制的亮点）
    function drawCityDot(p) {
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 9 * dpr);
      g.addColorStop(0, 'rgba(224, 255, 248, 0.5)');
      g.addColorStop(1, 'rgba(224, 255, 248, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, 9 * dpr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2fffc';
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.8 * dpr, 0, Math.PI * 2); ctx.fill();
    }

    // —— 样式一：霓虹光圈（市域高亮 + 中心亮点 + 名称）——
    function drawNeon() {
      CITIES.forEach(function (c) {
        if (!hasCoords(c)) return;
        var p = canvasXY(c.lng, c.lat);
        if (!p) return;
        drawCityDot(p);
        drawNameLabel(c, { x: p.x, y: p.y - 2 * dpr });
      });
    }

    // —— 样式二：迷雾探索（暗幕按市域轮廓挖空 + 发光边界）——
    function drawFog() {
      ctx.fillStyle = 'rgba(6, 10, 16, 0.93)';
      ctx.fillRect(0, 0, fx.width, fx.height);

      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      CITIES.forEach(function (c) {
        if (!hasCoords(c)) return;
        var p = canvasXY(c.lng, c.lat);
        if (!p) return;
        var r = 36 * dpr;
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, 'rgba(0,0,0,0.95)');
        g.addColorStop(0.7, 'rgba(0,0,0,0.5)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      });
      // 市域轮廓整体挖空（阴影羽化以设备像素计，边缘柔和）
      ctx.setTransform(view.s * dpr, 0, 0, view.s * dpr, view.tx * dpr, view.ty * dpr);
      ctx.shadowColor = '#000'; ctx.shadowBlur = 14 * dpr;
      ctx.fillStyle = '#000';
      CITIES.forEach(function (c) {
        if (c._shapePath) ctx.fill(c._shapePath, 'evenodd');
      });
      ctx.lineWidth = 6 / view.s;
      ctx.strokeStyle = '#000';
      CITIES.forEach(function (c) {
        if (c._shapePath) ctx.stroke(c._shapePath);
      });
      ctx.restore();

      // 挖空边界的青色微光
      ctx.save();
      ctx.setTransform(view.s * dpr, 0, 0, view.s * dpr, view.tx * dpr, view.ty * dpr);
      ctx.shadowColor = 'rgba(96, 245, 224, 0.9)';
      ctx.shadowBlur = 8 * dpr;
      ctx.strokeStyle = 'rgba(110, 246, 226, 0.4)';
      ctx.lineWidth = 1.2 / view.s;
      CITIES.forEach(function (c) {
        if (c._shapePath) ctx.stroke(c._shapePath);
      });
      ctx.restore();

      CITIES.forEach(function (c) {
        if (!hasCoords(c)) return;
        var p = canvasXY(c.lng, c.lat);
        if (!p) return;
        drawCityDot(p);
        drawNameLabel(c, p);
      });
    }

    // —— 样式三：星火脉冲（市域高亮 + 中心光点扩散波纹）——
    function drawPulse(t) {
      var T = reduceMotion ? 1200 : t;
      CITIES.forEach(function (c) {
        if (!hasCoords(c)) return;
        var p = canvasXY(c.lng, c.lat);
        if (!p) return;

        drawCityDot(p);

        for (var k = 0; k < 2; k++) {
          var ph = ((T / 3000) + k * 0.5) % 1;
          var r = (5 + ph * 26) * dpr;
          ctx.strokeStyle = 'rgba(90, 240, 220, ' + ((1 - ph) * 0.5).toFixed(3) + ')';
          ctx.lineWidth = 1.4 * dpr;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
        }

        drawNameLabel(c, { x: p.x, y: p.y + 4 * dpr });
      });
    }

    /* ================= 行迹图层 ================= */
    // 行迹路线：柔光底衬 + 主线 + 流动光段；核心节点带名称
    // （节点标签画在节点上方，避开城市名称标签所在的下方位置）
    function drawTrails(t) {
      TRAILS.forEach(function (r) {
        var pts = r.pts.map(function (p) { return canvasXY(p.lng, p.lat); });
        var path = new Path2D();
        for (var i = 0; i < pts.length; i++) {
          if (i === 0) path.moveTo(pts[i].x, pts[i].y); else path.lineTo(pts[i].x, pts[i].y);
        }

        ctx.save();
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.strokeStyle = rgba(r.color, 0.16);
        ctx.lineWidth = 8 * dpr;
        ctx.stroke(path);
        ctx.strokeStyle = rgba(r.color, 0.85);
        ctx.lineWidth = 2.4 * dpr;
        ctx.stroke(path);
        if (!reduceMotion) {
          ctx.setLineDash([3 * dpr, 15 * dpr]);
          ctx.lineDashOffset = -((t / 55) % 18) * dpr;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 3.4 * dpr;
          ctx.stroke(path);
          ctx.setLineDash([]);
        }
        ctx.restore();

        var labelXs = [];
        r.pts.forEach(function (p, i) {
          var q = pts[i];
          if (q.x < -60 || q.x > fx.width + 60 || q.y < -60 || q.y > fx.height + 60) return;
          drawTrailNode(q, r, i === 0 || i === r.pts.length - 1);
          // 标签避让：与所有已放置标签保持横向间距（路线可能折返，取绝对值）
          var ok = labelXs.every(function (x) { return Math.abs(q.x - x) >= 50 * dpr; });
          if (p.name && ok) {
            drawTrailLabel(p.name, q, r);
            labelXs.push(q.x);
          }
        });
      });
    }

    function drawTrailNode(p, r, isEnd) {
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 9 * dpr);
      g.addColorStop(0, rgba(r.color, 0.45));
      g.addColorStop(1, rgba(r.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, 9 * dpr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(r.color, 0.95);
      ctx.beginPath(); ctx.arc(p.x, p.y, (isEnd ? 3 : 2.1) * dpr, 0, Math.PI * 2); ctx.fill();
      if (isEnd) {
        // 起 / 终点加白圈
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 1 * dpr;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.8 * dpr, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function drawTrailLabel(text, p, r) {
      ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4 * dpr;
      ctx.fillStyle = mixWhite(r.color, 0.25);
      ctx.font = (10.5 * dpr) + 'px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, p.x, p.y - 14 * dpr);
      ctx.shadowBlur = 0;
    }

    // 命中行迹核心节点（悬停/点按提示用），半径略小于城市命中
    function hitTrailNode(clientX, clientY) {
      var rect = stage.getBoundingClientRect();
      var x = clientX - rect.left, y = clientY - rect.top;
      var best = null, bestD = 14;
      TRAILS.forEach(function (r) {
        r.pts.forEach(function (p) {
          if (!p.name) return;
          var q = cssXY(p.lng, p.lat);
          var d = Math.hypot(q.x - x, q.y - y);
          if (d < bestD) { bestD = d; best = { route: r, node: p }; }
        });
      });
      return best;
    }

    function showTrailTooltip(rn) {
      var p = cssXY(rn.node.lng, rn.node.lat);
      if (!p) return;
      tooltip.innerHTML = '';
      var b = document.createElement('b'); b.textContent = rn.node.name;
      tooltip.appendChild(b);
      tooltip.appendChild(document.createTextNode(' · ' + rn.route.tag));
      tooltip.style.left = p.x + 'px';
      tooltip.style.top = (p.y - 14) + 'px';
      tooltip.classList.add('show');
    }

    /* ================= 样式切换 ================= */
    function setMode(m) {
      if (MODES.indexOf(m) < 0) return;
      mode = m;
      try { localStorage.setItem('fog:mode:2', m); } catch (e) {}
      document.body.setAttribute('data-mode', m);
      syncModeButtons();
      closeCard();
      hideTooltip();
      scheduleRedraw();
    }

    /* ================= 城市卡片 / 悬停提示 ================= */
    function buildCardEl(c) {
      var card = document.createElement('div');
      card.className = 'city-card';

      var close = document.createElement('button');
      close.type = 'button'; close.className = 'cc-close';
      close.setAttribute('aria-label', '关闭'); close.textContent = '×';
      close.addEventListener('click', function (e) { e.stopPropagation(); closeCard(); });
      card.appendChild(close);

      var idx = CITIES.indexOf(c) + 1;
      var kick = document.createElement('div');
      kick.className = 'cc-kicker';
      kick.textContent = '第 ' + idx + ' 站 · ' + (c.province || '');
      card.appendChild(kick);

      var name = document.createElement('div');
      name.className = 'cc-name'; name.textContent = c.name;
      card.appendChild(name);

      var date = document.createElement('div');
      date.className = 'cc-date';
      var days = daysSince(c.date);
      date.textContent = c.date
        ? '点亮于 ' + c.date + (days === null ? '' : ' · 已照亮 ' + days + ' 天')
        : '点亮日期待补充';
      card.appendChild(date);

      if (c.note) {
        var note = document.createElement('p');
        note.className = 'cc-note'; note.textContent = c.note;
        card.appendChild(note);
      }
      return card;
    }

    function positionCard(p) {
      if (!cardWrap) return;
      var w = Math.min(280, stage.clientWidth * 0.8);
      cardWrap.style.left = Math.min(Math.max(p.x, w / 2 + 8), stage.clientWidth - w / 2 - 8) + 'px';
      cardWrap.style.top = Math.max(p.y - 14, 130) + 'px';
    }

    function openCard(c) {
      if (activeCity === c) return;
      closeCard();
      hideTooltip();
      activeCity = c;
      if (!hasCoords(c)) return;
      var p = cssXY(c.lng, c.lat);
      if (!p) return;
      var wrap = document.createElement('div');
      wrap.className = 'demo-card-wrap';
      wrap.appendChild(buildCardEl(c));
      cardLayer.appendChild(wrap);
      cardWrap = wrap;
      positionCard(p);
    }

    function closeCard() {
      activeCity = null;
      if (cardWrap) { cardWrap.parentNode.removeChild(cardWrap); cardWrap = null; }
    }

    function showTooltip(c) {
      var p = hasCoords(c) && cssXY(c.lng, c.lat);
      if (!p) return;
      tooltip.innerHTML = '';
      var b = document.createElement('b'); b.textContent = c.name;
      tooltip.appendChild(b);
      tooltip.appendChild(document.createTextNode(c.date ? ' · ' + c.date : ''));
      tooltip.style.left = p.x + 'px';
      tooltip.style.top = (p.y - 14) + 'px';
      tooltip.classList.add('show');
    }
    function hideTooltip() { tooltip.classList.remove('show'); }

    function hitCity(clientX, clientY) {
      var rect = stage.getBoundingClientRect();
      var x = clientX - rect.left, y = clientY - rect.top;
      // 市域轮廓优先：屏幕点 → 基准坐标 → 点在多边形内测试
      var bx = (x - view.tx) / view.s, by = (y - view.ty) / view.s;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      var best = null;
      for (var i = 0; i < CITIES.length; i++) {
        if (CITIES[i]._shapePath && ctx.isPointInPath(CITIES[i]._shapePath, bx, by, 'evenodd')) {
          best = CITIES[i];
          break;
        }
      }
      ctx.restore();
      if (best) return best;
      // 回退：中心亮点距离（轮廓过小或缺失时）
      var bestD = 20;
      CITIES.forEach(function (c) {
        if (!hasCoords(c)) return;
        var p = cssXY(c.lng, c.lat);
        if (!p) return;
        var d = Math.hypot(p.x - x, p.y - y);
        if (d < bestD) { bestD = d; best = c; }
      });
      return best;
    }

    /* ================= 画布交互：拖拽 / 缩放 / 点按 ================= */
    var pointers = new Map();
    var panState = null;   // {sx, sy, tx0, ty0, moved, t0}
    var pinchState = null; // {dist, cx, cy, s, tx, ty}

    function localXY(e) {
      var r = fx.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function pinchBase() {
      var ps = Array.from(pointers.values());
      var dx = ps[0].x - ps[1].x, dy = ps[0].y - ps[1].y;
      return {
        dist: Math.max(Math.hypot(dx, dy), 1),
        cx: (ps[0].x + ps[1].x) / 2,
        cy: (ps[0].y + ps[1].y) / 2,
        s: view.s, tx: view.tx, ty: view.ty
      };
    }

    fx.addEventListener('pointerdown', function (e) {
      try { fx.setPointerCapture(e.pointerId); } catch (err) { /* 指针可能已失效，忽略 */ }
      var p = localXY(e);
      pointers.set(e.pointerId, p);
      if (pointers.size === 1) {
        panState = { sx: p.x, sy: p.y, tx0: view.tx, ty0: view.ty, moved: false, t0: Date.now() };
        pinchState = null;
        fx.classList.add('dragging');
      } else if (pointers.size === 2) {
        panState = null;
        pinchState = pinchBase();
      }
    });

    fx.addEventListener('pointermove', function (e) {
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, localXY(e));

      if (pointers.size === 2 && pinchState) {
        var b = pinchBase();
        var ns = Math.min(Math.max(pinchState.s * b.dist / pinchState.dist, view.minS), view.maxS);
        var k = ns / pinchState.s;
        view.s = ns;
        view.tx = b.cx - (pinchState.cx - pinchState.tx) * k;
        view.ty = b.cy - (pinchState.cy - pinchState.ty) * k;
        viewDirty = true;
        clampPan();
        closeCard();
        hideTooltip();
        scheduleRedraw();
        return;
      }
      if (pointers.size === 1 && panState) {
        var p = pointers.get(e.pointerId);
        if (Math.hypot(p.x - panState.sx, p.y - panState.sy) > 6) panState.moved = true;
        if (panState.moved) {
          view.tx = panState.tx0 + p.x - panState.sx;
          view.ty = panState.ty0 + p.y - panState.sy;
          viewDirty = true;
          clampPan();
          closeCard();
          hideTooltip();
          scheduleRedraw();
        }
        return;
      }
      // 悬停（桌面）：行迹节点优先，其次点亮城市
      var tn = hitTrailNode(e.clientX, e.clientY);
      if (tn) {
        fx.classList.add('hover-node');
        fx.classList.remove('hover-city');
        showTrailTooltip(tn);
        return;
      }
      fx.classList.remove('hover-node');
      var hit = hitCity(e.clientX, e.clientY);
      fx.classList.toggle('hover-city', !!hit);
      if (hit) showTooltip(hit); else hideTooltip();
    });

    function endPointer(e) {
      var wasSingle = pointers.size === 1;
      pointers.delete(e.pointerId);
      if (wasSingle && panState && !panState.moved && Date.now() - panState.t0 < 600) {
        // 点按（未拖动）→ 行迹节点提示；命中城市则开卡片，否则全部收起
        var tn = hitTrailNode(e.clientX, e.clientY);
        if (tn) {
          showTrailTooltip(tn);
        } else {
          var c = hitCity(e.clientX, e.clientY);
          if (c) openCard(c);
          else { closeCard(); hideTooltip(); }
        }
      }
      panState = null;
      pinchState = null;
      if (pointers.size === 1) {
        var rest = Array.from(pointers.values())[0];
        panState = { sx: rest.x, sy: rest.y, tx0: view.tx, ty0: view.ty, moved: true, t0: Date.now() };
      }
      if (pointers.size === 0) fx.classList.remove('dragging');
    }
    fx.addEventListener('pointerup', endPointer);
    fx.addEventListener('pointercancel', endPointer);

    fx.addEventListener('wheel', function (e) {
      e.preventDefault();
      var p = localXY(e);
      zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0016));
    }, { passive: false });

    fx.addEventListener('dblclick', function (e) {
      var p = localXY(e);
      zoomAt(p.x, p.y, 1.9);
    });

    fx.addEventListener('mouseleave', hideTooltip);

    /* ================= 启动 ================= */
    function init() {
      sizeFx();
      fitView();
      buildStats();
      buildModeSwitch();
      document.body.setAttribute('data-mode', mode);
      syncModeButtons();

      window.addEventListener('resize', function () {
        sizeFx();
        if (viewDirty) {
          computeZoomBounds();
          view.s = Math.min(Math.max(view.s, view.minS), view.maxS);
          clampPan();
        } else {
          fitView();
        }
        scheduleRedraw();
        updateCardPosition();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeCard(); hideTooltip(); }
      });

      scheduleRedraw();
    }

    init();
  })();
  </script>
</body>
</html>
