<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nailcui</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 0.9rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.button {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.3s ease, color 0.3s ease;
    }

    a.button:hover {
      background: #fff;
      color: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello, I'm Nailcui</h1>
    <p>欢迎来到我的个人主页，网站重建中，敬请期待。</p>
    <div class="links">
      <a class="button" href="./fog.html">🌫 世界迷雾</a>
      <a class="button" href="https://github.com/nailcui" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
