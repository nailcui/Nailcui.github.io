<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e12">
<meta name="description" content="3D 挖掘机 —— 可驾驶的重型履带挖掘机，手写 WebGL 渲染，零外部资源。">
<title>3D 挖掘机 · Nailcui</title>
<link rel="stylesheet" href="./vehicle.css">
</head>
<body>
<canvas id="gl"></canvas>
<script src="./vehicle3d.js"></script>
<script>
(function () {
'use strict';
var V = V3D, PI = V.PI, rad = V.rad, clamp = V.clamp, lerp = V.lerp, nearAng = V.nearAng;
var T = V.T, S = V.S, RX = V.RX, RY = V.RY, RZ = V.RZ;
var m4chain = V.m4chain, m4mul = V.m4mul, m4ident = V.m4ident, pt = V.pt;

/* ---------------- 演示状态 ---------------- */
var demo = { on: false, i: 0, t: 0, done: 0, steps: [], loopFrom: 1 };

var app = V3D.createApp({
  title: '3D 挖掘机',
  badge: 'HE336',
  badgeSub: 'HYDRAULIC EXCAVATOR',
  hint: '拖拽旋转 · 滚轮缩放 · WASD 驾驶 · Q/E 回转 · R/F 动臂 · T/G 斗杆 · Z/X 铲斗',
  buttons: [
    { id: 'demo', label: '自动演示', onClick: function () { demo.on ? stopDemo() : startDemo(); } },
    { id: 'follow', label: '跟随镜头' },
    { id: 'reset', label: '重置', onClick: function () { resetAll(); } },
    { id: 'help', label: '操作说明', onClick: function () { toggleHelp(); } }
  ],
  followBtn: true,
  keys: [
    ['<b>W</b><b>S</b> 行驶', '<b>A</b><b>D</b> 转向', '<b>Q</b><b>E</b> 回转'],
    ['<b>R</b><b>F</b> 动臂', '<b>T</b><b>G</b> 斗杆', '<b>Z</b><b>X</b> 铲斗'],
    ['<b>空格</b> 停止', '<b>⏎</b> 演示', '<b>C</b> 跟随 · <b>H</b> 帮助']
  ],
  touchRight: [
    ['sl', '左旋'], ['sr', '右旋'],
    ['bu', '升臂'], ['bd', '降臂'],
    ['ai', '收杆'], ['ao', '放杆'],
    ['bc', '收斗'], ['bo', '开斗']
  ],
  help:
    '<h2>操作说明</h2>' +
    '<h4>行 驶</h4>' +
    '<p><b>W</b>/<b>↑</b> 前进 · <b>S</b>/<b>↓</b> 后退 · <b>A</b>/<b>←</b>/<b>D</b>/<b>→</b> 履带差速转向</p>' +
    '<h4>工作装置</h4>' +
    '<p><b>Q</b>/<b>E</b> 上车左/右回转<br><b>R</b>/<b>F</b> 动臂升/降 · <b>T</b>/<b>G</b> 斗杆收/放 · <b>Z</b>/<b>X</b> 铲斗收（挖）/开（卸）</p>' +
    '<h4>其 他</h4>' +
    '<p><b>空格</b> 全部停止 · <b>⏎</b> 自动挖掘演示 · <b>C</b> 跟随镜头 · <b>H</b> 本说明</p>' +
    '<h4>鼠 标</h4><p>拖拽旋转视角 · 滚轮缩放</p>' +
    '<h4>触 屏</h4><p>单指拖拽旋转 · 双指缩放 · 底部按钮操控</p>',
  cam: { yaw: 0.45 + PI - 1.15, pitch: 0.26, dist: 13.5 },
  mound: { x: 7.6, z: -3.0, r: 2.5, h: 1.7 },
  dirt: 0x6d5f49,
  followTarget: function () { return [sim.x, sim.z]; },
  shadowCenter: function () { return [sim.x, 1.4, sim.z]; },
  shadowHalf: 12,
  extraKeys: { KeyQ: 'sl', KeyE: 'sr', KeyR: 'bu', KeyF: 'bd', KeyT: 'ai', KeyG: 'ao', KeyZ: 'bc', KeyX: 'bo' },
  manualExtra: ['sl', 'sr', 'bu', 'bd', 'ai', 'ao', 'bc', 'bo'],
  onStop: function () {
    stopDemo();
    sim.v = 0; sim.w = 0; sim.tv = 0; sim.tw = 0;
    for (var k in sim.JV) sim.JV[k] = 0;
  },
  onEnter: function () { demo.on ? stopDemo() : startDemo(); },
  update: update
});

if (!app) return;
var gl = app.gl;
var key = app.key;

/* ============================================================
   材质（伪 PBR：metal=环境反射金属度 / mud=低处泥污）
   ============================================================ */
var M_YELLOW  = V.Mat(0xe8a30c, [0.34,0.30,0.20], 30, { metal: 0.16, mud: 0.10 });
var M_YELLOW2 = V.Mat(0xc8900a, [0.30,0.26,0.18], 26, { metal: 0.16, mud: 0.16 });
var M_CHAR    = V.Mat(0x2a2a2e, [0.14,0.14,0.15], 18, { metal: 0.34, mud: 0.34 });
var M_BLACK   = V.Mat(0x1a1a1d, [0.18,0.18,0.19], 22, { metal: 0.25, mud: 0.20 });
var M_BELT    = V.Mat(0x232326, [0.07,0.07,0.075], 10, { metal: 0.48, mud: 0.50 });
var M_STEEL   = V.Mat(0x45464e, [0.50,0.51,0.55], 36, { metal: 0.62, mud: 0.14 });
var M_CHROME  = V.Mat(0xc4c8d2, [1.25,1.25,1.20], 110, { metal: 0.96, mud: 0.0 });
var M_GLASS   = V.Mat(0x26333f, [1.6,1.7,1.8], 140, { alpha: 0.44, metal: 0.85, mud: 0 });
var M_RUBBER  = V.Mat(0x141416, [0.04,0.04,0.04], 8, { metal: 0.02, mud: 0.30 });
var M_LAMP    = V.Mat(0x777777, [0.2,0.2,0.2], 20, { emis: 0xfff4cc, emisK: 1.6, metal: 0.1, mud: 0.05 });
var M_BEACON  = V.Mat(0x993800, [0.1,0.05,0.02], 12, { emis: 0xff8830, emisK: 1.0, metal: 0.1, mud: 0 });
var M_RUST    = V.Mat(0x6a5138, [0.06,0.05,0.04], 12, { metal: 0.4, mud: 0.55 });
var texStripe = app.makeStripeTex();
var M_STRIPE  = { color: [1,1,1], spec: [0.2,0.2,0.2], shin: 24, emis: [0,0,0], alpha: 1, tex: texStripe, cut: 0.45, metal: 0.12, mud: 0.22 };
var M_LABEL   = { color: [1,1,1], spec: [0.1,0.1,0.1], shin: 20, emis: [0,0,0], alpha: 1, tex: app.texLabel, cut: 0.45, metal: 0.1, mud: 0.18 };

/* ---------------- 单位网格与液压缸/软管 ---------------- */
var gUnitCyl = new V.Geo(); gUnitCyl.cyl(m4ident(), 1, 1, 1, 14, true);
var meshUnitCyl = app.makeMesh(gUnitCyl);
var gUnitSph = new V.Geo(); gUnitSph.sphere(m4ident(), 1, 10, 8);
var meshUnitSph = app.makeMesh(gUnitSph);
var _cylM = m4ident(), _tubeM = m4ident();
var drawCyl = V.makeCylHelper(meshUnitCyl, meshUnitSph, _cylM);
var drawTube = V.makeTubeHelper(meshUnitCyl, meshUnitSph, _tubeM);
function drawOneFactory(prog, depth) {
  return function (mesh, kind, model) {
    if (depth) {
      V.bindMesh(prog, mesh);
      gl.uniformMatrix4fv(prog.u.uModel, false, model);
      gl.drawElements(gl.TRIANGLES, mesh.n, gl.UNSIGNED_SHORT, 0);
    } else {
      var mat;
      switch (kind) {
        case 'rod': mat = M_CHROME; break;
        case 'joint': mat = M_CHAR; break;
        case 'tube': mat = M_RUBBER; break;
        default: mat = M_STEEL;
      }
      app.drawMat(prog, mesh, mat, model);
    }
  };
}

/* ---------------- 机器状态 ---------------- */
var SPAWN = { x: 0, z: 2.6, h: 0.48 };
var PARK = { boom: rad(-16), arm: rad(122), bucket: rad(116) };
var sim = {
  x: SPAWN.x, z: SPAWN.z, h: SPAWN.h,
  v: 0, w: 0, tv: 0, tw: 0,
  distL: 0, distR: 0,
  J: { swing: 0, boom: PARK.boom, arm: PARK.arm, bucket: PARK.bucket },
  JV: { swing: 0, boom: 0, arm: 0, bucket: 0 }
};
var VMAX = 1.9, WMAX = 0.85;
var LIMIT = { boom: [-0.58, 0.92], arm: [-2.35, 2.30], bucket: [-0.30, 2.75] };
var RATE = { boom: 0.42, arm: 0.55, bucket: 0.85, swing: 0.62 };

/* ---------------- 履带参数 ---------------- */
var BELT = { Lb: 3.86, R: 0.55, W: 0.86, N: 60, cz: 1.32 };
var beltMesh;
(function () {
  var b = V.buildBeltGeo(BELT.Lb, BELT.R, BELT.W, BELT.N);
  BELT.total = b.total;
  beltMesh = app.makeBeltMesh(b.geo);
})();

/* ============================================================
   节点树
   ============================================================ */
var machine = new V.Node(null, m4ident());
var trackL = new V.Node(machine, T(0, 0.01, BELT.cz));
var trackR = new V.Node(machine, T(0, 0.01, -BELT.cz));
var upper = new V.Node(machine, V.m4ident());
var boomN = new V.Node(upper, m4ident());
var armN = new V.Node(boomN, m4ident());
var bktN = new V.Node(armN, m4ident());
var crankN = new V.Node(armN, m4ident());   /* 摇臂（与铲斗同轴销） */

/* ============================================================
   底盘：两侧履带架 + 中央车架 + 回转支承座
   ============================================================ */
(function () {
  var gd = new V.Geo();
  [1, -1].forEach(function (sg) {
    gd.loft(m4chain(T(0, 0, sg * BELT.cz), RY(sg > 0 ? 0 : PI)), [
      { x: -2.18, y: 0.56, w: 0.32, h: 0.34, r: 0.35 },
      { x: -1.70, y: 0.56, w: 0.34, h: 0.30, r: 0.35 },
      { x: 0.00,  y: 0.56, w: 0.34, h: 0.30, r: 0.35 },
      { x: 1.70,  y: 0.56, w: 0.34, h: 0.30, r: 0.35 },
      { x: 2.18,  y: 0.56, w: 0.32, h: 0.34, r: 0.35 }
    ]);
    gd.rbox(T(1.62, 0.62, sg * BELT.cz), 0.24, 0.14, 0.16, 0.04, 2);
    gd.box(m4chain(T(-0.9, 0.92, sg * 0.62), RZ(sg > 0 ? rad(-14) : rad(194))), 0.7, 0.05, 0.09);
    gd.box(m4chain(T(0.9, 0.92, sg * 0.62), RZ(sg > 0 ? rad(14) : rad(166))), 0.7, 0.05, 0.09);
  });
  gd.box(T(0, 1.02, 0.55), 1.30, 0.14, 0.16);
  gd.box(T(0, 1.02, -0.55), 1.30, 0.14, 0.16);
  gd.cyl(T(0, 1.10, 0), 0.90, 0.98, 0.14, 24, true);
  [1, -1].forEach(function (sg) {
    gd.box(T(-2.28, 0.60, sg * BELT.cz), 0.20, 0.26, 0.10);
    gd.box(T(2.28, 0.60, sg * BELT.cz), 0.20, 0.26, 0.10);
  });
  trackL.add(gl, gd, M_CHAR);
  trackR.add(gl, gd, M_CHAR);
})();

/* 轮组几何：驱动齿圈 / 双缘引导轮 / 双缘支重轮 */
var meshSprocket, meshIdler, meshRoller;
(function () {
  var gs = new V.Geo();
  gs.cyl(RX(PI/2), 0.40, 0.40, 0.26, 14, true);
  for (var i = 0; i < 12; i++) {
    var a = i / 12 * 2 * PI;
    gs.box(m4chain(T(Math.cos(a) * 0.45, Math.sin(a) * 0.45, 0), RZ(a)), 0.08, 0.055, 0.20);
  }
  gs.cyl(RX(PI/2), 0.14, 0.14, 0.30, 8, false);
  meshSprocket = app.makeMesh(gs);
  var gi = new V.Geo();
  gi.cyl(RX(PI/2), 0.44, 0.44, 0.20, 14, true);
  gi.cyl(RX(PI/2), 0.48, 0.48, 0.08, 14, false);
  gi.cyl(RX(PI/2), 0.20, 0.20, 0.34, 8, false);
  meshIdler = app.makeMesh(gi);
  var gr = new V.Geo();
  gr.cyl(RX(PI/2), 0.26, 0.26, 0.18, 12, true);
  gr.cyl(RX(PI/2), 0.29, 0.29, 0.05, 12, false);
  gr.cyl(RX(PI/2), 0.29, 0.29, 0.05, 12, false);
  gr.cyl(RX(PI/2), 0.11, 0.11, 0.30, 8, false);
  meshRoller = app.makeMesh(gr);
})();

/* ============================================================
   上车：回转平台 / 齿圈 / 配重（格栅+警示条）/ 机舱（检修门）/ 驾驶室
   ============================================================ */
(function () {
  var gy = new V.Geo(), gd = new V.Geo();
  var ge = new V.Geo(), gg = new V.Geo();

  gy.rbox(T(-0.35, 0.28, 0), 1.62, 0.16, 1.14, 0.09, 3);
  [1, -1].forEach(function (sg) {
    gy.box(T(-0.35, 0.10, sg * 1.12), 1.62, 0.10, 0.05);
  });

  /* 回转支承外齿圈 */
  gd.cyl(T(0, 0.02, 0), 0.94, 0.94, 0.10, 26, true);
  for (var i = 0; i < 16; i++) {
    var aa = i / 16 * 2 * PI;
    gd.box(m4chain(T(Math.cos(aa) * 0.99, 0.02, Math.sin(aa) * 0.99), RY(-aa)), 0.05, 0.10, 0.07);
  }

  /* 配重 */
  gy.rbox(T(-1.98, 0.92, 0), 0.52, 0.62, 1.26, 0.17, 4);
  gd.box(T(-1.98, 0.32, 0), 0.50, 0.07, 1.28);
  gd.box(T(-2.48, 0.95, 0), 0.015, 0.46, 0.98);
  for (i = 0; i < 5; i++) gy.box(T(-2.49, 0.78 + i * 0.11, 0), 0.02, 0.035, 0.86);
  [1, -1].forEach(function (sg) {
    var cx = -1.98, cy = 0.42, w = 0.52, h = 0.09, z = sg * 1.285;
    var uL = sg > 0 ? 0 : 1, uR = sg > 0 ? 1 : 0;
    var i00 = ge.vert(m4ident(), m4ident(), cx - w, cy - h, z, 0, 0, sg, uL, 0);
    var i10 = ge.vert(m4ident(), m4ident(), cx + w, cy - h, z, 0, 0, sg, uR, 0);
    var i11 = ge.vert(m4ident(), m4ident(), cx + w, cy + h, z, 0, 0, sg, uR, 1);
    var i01 = ge.vert(m4ident(), m4ident(), cx - w, cy + h, z, 0, 0, sg, uL, 1);
    ge.i.push(i00, i10, i11, i00, i11, i01);
  });

  /* 发动机舱：检修门（内嵌+铰链+拉手）/ 盖板 / 进气格栅 / 消音+排气 */
  gy.rbox(T(-0.62, 1.06, 0), 0.98, 0.44, 1.06, 0.10, 4);
  [1, -1].forEach(function (sg) {
    gd.box(T(-0.55, 1.06, sg * 1.075), 0.42, 0.30, 0.012);
    gd.box(T(-0.55, 1.06, sg * 1.085), 0.40, 0.28, 0.008);
    gd.cyl(m4chain(T(-0.90, 1.06, sg * 1.092), RY(sg > 0 ? 0 : PI)), 0.012, 0.012, 0.44, 6, false);
    gd.box(T(-0.22, 1.06, sg * 1.092), 0.015, 0.05, 0.02);
    gd.box(T(-0.35, 1.515, sg * 0.52), 0.34, 0.012, 0.42);
    gd.box(T(-1.52, 1.10, sg * 0.62), 0.015, 0.16, 0.30);
    for (var k = 0; k < 3; k++) gy.box(T(-1.52, 1.045 + k * 0.055, sg * 0.62), 0.018, 0.028, 0.26);
  });
  gd.cyl(T(-1.62, 1.62, -0.55), 0.10, 0.10, 0.30, 10, true);
  gd.cyl(T(-1.62, 1.90, -0.55), 0.055, 0.05, 0.42, 10, true);
  gd.box(T(-1.62, 2.13, -0.55), 0.10, 0.015, 0.14);
  gd.cyl(T(-1.62, 2.14, -0.55), 0.065, 0.06, 0.05, 10, true);

  /* 驾驶室：柱/顶/玻璃分块/门缝/把手/雨刷/内饰 */
  gy.box(T(0.62, 0.52, 0.66), 0.52, 0.10, 0.46);
  gy.box(T(1.06, 1.30, 0.34), 0.065, 0.66, 0.05);
  gy.box(T(1.06, 1.30, 0.98), 0.065, 0.66, 0.05);
  gy.box(T(0.18, 1.30, 0.32), 0.05, 0.66, 0.05);
  gy.box(T(0.18, 1.30, 1.00), 0.05, 0.66, 0.05);
  gy.rbox(T(0.62, 2.10, 0.66), 0.48, 0.085, 0.50, 0.04, 3);
  gy.box(T(0.62, 1.06, 0.66), 0.48, 0.08, 0.44);
  gd.box(T(0.62, 1.30, 1.145), 0.46, 0.014, 0.02);
  gd.box(T(0.94, 1.42, 1.128), 0.015, 0.05, 0.018);
  /* 玻璃分块：前挡（带下缘斜台）/侧窗/门窗/后窗 */
  gg.box(m4chain(T(1.065, 1.52, 0.66), RZ(rad(-6))), 0.02, 0.52, 0.56);
  gg.box(m4chain(T(1.055, 1.02, 0.66), RZ(rad(-10))), 0.02, 0.26, 0.56);
  gg.box(T(0.62, 1.42, 1.115), 0.42, 0.36, 0.015);
  gg.box(T(0.62, 1.42, 0.205), 0.42, 0.36, 0.015);
  gg.box(T(0.21, 1.42, 0.66), 0.015, 0.36, 0.44);
  gd.box(m4chain(T(1.115, 1.62, 0.60), RZ(rad(-32))), 0.26, 0.012, 0.02);
  gd.box(T(0.42, 1.42, 0.86), 0.10, 0.30, 0.24);
  gd.box(T(0.30, 1.28, 0.86), 0.14, 0.06, 0.26);
  gd.box(T(0.72, 1.22, 0.42), 0.16, 0.12, 0.30);
  gd.box(T(0.72, 1.22, 0.90), 0.16, 0.12, 0.30);

  /* 踏板 */
  [1, -1].forEach(function (sg) {
    gd.box(T(0.30, 0.62, sg * 1.22), 0.24, 0.03, 0.16);
    gd.box(T(0.05, 0.94, sg * 1.22), 0.24, 0.03, 0.16);
    gd.box(T(-0.20, 1.26, sg * 1.22), 0.24, 0.03, 0.16);
  });

  /* 扶手 */
  function rail(x0, y0, z0, x1, y1, z1) {
    gd.tube(m4ident(), [[x0, y0, z0], [x1, y1, z1]], 0.016, 6);
  }
  rail(-2.42, 2.02, 1.18, -1.70, 2.02, 1.18);
  rail(-2.42, 2.02, -1.18, -1.70, 2.02, -1.18);
  rail(-2.42, 1.56, 1.18, -2.42, 2.02, 1.18);
  rail(-2.42, 1.56, -1.18, -2.42, 2.02, -1.18);
  rail(-1.70, 1.56, 1.18, -1.70, 2.02, 1.18);
  rail(-1.15, 2.16, 0.90, -0.30, 2.16, 0.90);
  rail(-1.15, 1.66, 0.90, -1.15, 2.16, 0.90);
  rail(-0.30, 1.66, 0.90, -0.30, 2.16, 0.90);

  /* 工作灯 + 警示灯 */
  gd.box(T(1.02, 2.16, 0.40), 0.06, 0.04, 0.06);
  gd.box(T(1.02, 2.16, 0.92), 0.06, 0.04, 0.06);
  ge.box(T(1.055, 2.16, 0.40), 0.012, 0.03, 0.05);
  ge.box(T(1.055, 2.16, 0.92), 0.012, 0.03, 0.05);
  gd.cyl(T(0.30, 2.22, 0.30), 0.055, 0.055, 0.05, 10, true);
  ge.cyl(T(0.30, 2.28, 0.30), 0.048, 0.052, 0.08, 10, true);

  /* 铭牌 */
  var lab = new V.Geo();
  function labelQuad(z, flip) {
    var uL = flip ? 1 : 0, uR = flip ? 0 : 1;
    var cx = -1.98, cy = 0.95, w = 0.40, h = 0.20;
    var i00 = lab.vert(m4ident(), m4ident(), cx - w, cy - h, z, 0, 0, 1, uL, 1);
    var i10 = lab.vert(m4ident(), m4ident(), cx + w, cy - h, z, 0, 0, 1, uR, 1);
    var i11 = lab.vert(m4ident(), m4ident(), cx + w, cy + h, z, 0, 0, 1, uR, 0);
    var i01 = lab.vert(m4ident(), m4ident(), cx - w, cy + h, z, 0, 0, 1, uL, 0);
    lab.i.push(i00, i10, i11, i00, i11, i01);
  }
  labelQuad(1.288, false);
  labelQuad(-1.288, true);

  upper.add(gl, gy, M_YELLOW);
  upper.add(gl, gd, M_CHAR);
  upper.add(gl, ge, M_STRIPE);
  upper.addGlass(gl, gg, M_GLASS);
  upper.addDecal(gl, lab, M_LABEL);
})();

/* 动臂根耳板（上车侧） */
(function () {
  var gd = new V.Geo();
  [1, -1].forEach(function (sg) {
    gd.box(m4chain(T(0.52, 2.42, sg * 0.30), RZ(rad(-6))), 0.20, 0.62, 0.05);
  });
  upper.add(gl, gd, M_YELLOW);
})();

/* ============================================================
   动臂：弯曲变截面放样梁 + 翼板 + 叉座 + 销轴
   ============================================================ */
(function () {
  var gy = new V.Geo(), gd = new V.Geo();
  gy.loft(m4ident(), [

/* ============================================================
   四连杆解算：铲斗角 → 摇臂角（连杆定长约束，圆-圆交点）
   ============================================================ */
var LINK_R = 0.42, LINK_L = 0.46;
var LINK_DY = 0.56, LINK_DX = 0.00;
function solveCrank(rot) {
  var ddx = LINK_DX * Math.cos(rot) - LINK_DY * Math.sin(rot);
  var ddy = LINK_DX * Math.sin(rot) + LINK_DY * Math.cos(rot);
  var dl = Math.hypot(ddx, ddy) || 1;
  var dist = Math.min(dl, LINK_R + LINK_L - 0.01);
  var a = (LINK_R * LINK_R + dist * dist - LINK_L * LINK_L) / (2 * dist);
  var h = Math.sqrt(Math.max(LINK_R * LINK_R - a * a, 0.0001));
  var ux = ddx / dl, uy = ddy / dl;
  var cx1 = a * ux + h * (-uy), cy1 = a * uy + h * (ux);
  var cx2 = a * ux - h * (-uy), cy2 = a * uy - h * (ux);
  var cx = cy1 >= cy2 ? cx1 : cx2, cy = cy1 >= cy2 ? cy1 : cy2;
  return Math.atan2(cy, cx);
}

/* ---------------- 演示 ---------------- */
function stopDemo() { demo.on = false; app.setDemo(false); }
function startDemo() {
  var dx = app.mound.x - sim.x, dz = app.mound.z - sim.z;
  var psi = Math.atan2(-dz, dx);
  var phiPile = nearAng(sim.J.swing, psi - sim.h + rad(6));
  var phiDump = nearAng(sim.J.swing, psi - sim.h - rad(142));
  demo.steps = [
    { drive: 2.0, dur: 3.4 },
    { j: { boom: rad(-24), arm: rad(-108), bucket: rad(-16), swing: phiPile }, mt: 10 },
    { j: { bucket: rad(128) }, mt: 3.0, dig: true },
    { j: { boom: rad(8), arm: rad(-62), bucket: rad(120) }, mt: 4 },
    { j: { swing: phiDump }, mt: 5 },
    { j: { bucket: rad(-22), arm: rad(-98) }, mt: 3, dump: true },
    { j: { boom: rad(-10), arm: rad(-26), bucket: rad(116) }, mt: 4 },
    { drive: -2.0, dur: 3.4 },
    { j: { swing: phiPile }, mt: 5 }
  ];
  demo.on = true; demo.i = 0; demo.t = 0; demo.done = 0;
  app.setDemo(true);
}
function resetAll() {
  stopDemo();
  sim.x = SPAWN.x; sim.z = SPAWN.z; sim.h = SPAWN.h;
  sim.v = 0; sim.w = 0; sim.tv = 0; sim.tw = 0;
  sim.J.swing = 0; sim.J.boom = PARK.boom; sim.J.arm = PARK.arm; sim.J.bucket = PARK.bucket;
  for (var k in sim.JV) sim.JV[k] = 0;
  app.camReset();
}
function demoStepAdvance() {
  demo.i++;
  if (demo.i >= demo.steps.length) demo.i = demo.loopFrom;
  demo.t = 0; demo.done = 0;
  var st = demo.steps[demo.i];
  if (st.j && st.j.swing !== undefined) st.j.swing = nearAng(sim.J.swing, st.j.swing);
}
function updateDemo(dt) {
  if (!demo.on) return;
  var st = demo.steps[demo.i];
  if (!st) { stopDemo(); return; }
  demo.t += dt;
  if (st.drive !== undefined) {
    demo.done += sim.v * dt;
    var rem = st.drive - demo.done;
    var tmax = Math.max(0.4, st.dur - demo.t);
    sim.tv = clamp(rem / tmax * 1.35, -VMAX, VMAX);
    sim.tw = 0;
    if (Math.abs(rem) < 0.1 || demo.t > st.dur + 1.5) demoStepAdvance();
  } else if (st.j) {
    sim.tv = 0; sim.tw = 0;
    var all = true;
    for (var k in st.j) {
      var target = st.j[k];
      var d = target - sim.J[k];
      if (Math.abs(d) > 0.015) all = false;
      var v = clamp(d / Math.max(dt, 1e-4), -RATE[k], RATE[k]);
      sim.JV[k] = lerp(sim.JV[k], v * Math.min(1, Math.abs(d) / 0.12 + 0.12), Math.min(1, dt * 14));
    }
    if (st.dig || st.dump) digDumpFx(dt, st);
    if (all || demo.t > st.mt) demoStepAdvance();
  }
}
var digTimer = 0, dumpTimer = 0, dustTimer = 0, exTimer = 0, stampAcc = 0;
function digDumpFx(dt, st) {
  bucketEdgeWorld(EDGE);
  if (st.dig) {
    var mh = app.moundH(EDGE[0], EDGE[2]);

    }

      }
    }
  }
}

/* ============================================================
   每帧更新
   ============================================================ */
var _machineM = m4ident();
function update(dt, t) {
  if (!demo.on) {
    sim.tv = ((key.f ? 1 : 0) - (key.b ? 1 : 0)) * VMAX;
    sim.tw = ((key.r ? 1 : 0) - (key.l ? 1 : 0)) * WMAX;
  }
  var av = 2.4, aw = 3.2;
  sim.v += clamp(sim.tv - sim.v, -av * dt, av * dt);
  sim.w += clamp(sim.tw - sim.w, -aw * dt, aw * dt);
  sim.x += Math.cos(sim.h) * sim.v * dt;
  sim.z += -Math.sin(sim.h) * sim.v * dt;
  sim.h += sim.w * dt;
  var sl = sim.v + sim.w * 1.32, sr = sim.v - sim.w * 1.32;
  sim.distL += sl * dt;
  sim.distR += sr * dt;
  sim.x = clamp(sim.x, -120, 120);
  sim.z = clamp(sim.z, -120, 120);

  if (!demo.on) {
    var dirs = {
      boom: (key.bu ? 1 : 0) - (key.bd ? 1 : 0),
      arm: (key.ai ? 1 : 0) - (key.ao ? 1 : 0),
      bucket: (key.bc ? 1 : 0) - (key.bo ? 1 : 0),
      swing: (key.sr ? 1 : 0) - (key.sl ? 1 : 0)
    };
    for (var j in dirs) {
      sim.JV[j] = lerp(sim.JV[j], dirs[j] * RATE[j], Math.min(1, dt * 12));
    }
  }
  for (j in sim.J) sim.J[j] += sim.JV[j] * dt;
  for (j in LIMIT) {
    if (sim.J[j] < LIMIT[j][0]) { sim.J[j] = LIMIT[j][0]; if (sim.JV[j] < 0) sim.JV[j] = 0; }
    if (sim.J[j] > LIMIT[j][1]) { sim.J[j] = LIMIT[j][1]; if (sim.JV[j] > 0) sim.JV[j] = 0; }
  }
  if (!demo.on && !key.bu && !key.bd && sim.J.boom > 0.02) {
    sim.J.boom = Math.max(0.02, sim.J.boom - 0.0022 * dt);
  }

  updateDemo(dt);

  var throttle = Math.abs(sim.v) / VMAX;
  var bob = app.reduced ? 0 : (0.006 + 0.010 * throttle) * Math.sin(t * 36) + 0.004 * Math.sin(t * 23.3);
  m4mul(T(sim.x, 0, sim.z), RY(sim.h), _machineM);
  machine.world = _machineM;
  trackL.local = T(0, 0.01, BELT.cz);
  trackR.local = T(0, 0.01, -BELT.cz);
  upper.local = m4mul(T(0, 1.16 + bob, 0), RY(sim.J.swing));
  boomN.local = m4mul(T(0.52, 2.42, 0), RZ(sim.J.boom));
  armN.local = m4mul(T(5.62, 1.76, 0), RZ(sim.J.arm));
  bktN.local = m4mul(T(2.95, 0.10, 0), RZ(sim.J.bucket));
  crankN.local = RZ(solveCrank(sim.J.bucket));
  trackL.update(_machineM);
  trackR.update(_machineM);
  upper.update(_machineM);

  app.setBlob(true, sim.x, sim.z, sim.h, 4.6, 2.9);
  app.updateParts(dt);
  app.uploadDecal(t);

  var moving = Math.abs(sim.v) > 0.15 || Math.abs(sim.w) > 0.2;
  if (moving) {
    stampAcc += Math.max(Math.abs(sl), Math.abs(sr)) * dt;
    if (stampAcc > 0.16) {
      stampAcc = 0;
      var sxo = Math.sin(sim.h), czo = Math.cos(sim.h);
      app.stampRect(sim.x + sxo * BELT.cz, sim.z + czo * BELT.cz, sim.h, 0.86, 0.42, 0.05);
      app.stampRect(sim.x - sxo * BELT.cz, sim.z - czo * BELT.cz, sim.h, 0.86, 0.42, 0.05);
    }
  }

  if (!app.reduced && (Math.abs(sim.v) > 0.55 || Math.abs(sim.w) > 0.5)) {
    dustTimer -= dt;
    if (dustTimer <= 0) {
      dustTimer = 0.06;
      for (var s = 0; s < 2; s++) {
        var bx = sim.x - Math.cos(sim.h) * 2.0;
        var bz = sim.z + Math.sin(sim.h) * 2.0;
        var ox = Math.sin(sim.h) * (s ? BELT.cz : -BELT.cz);
        var oz = Math.cos(sim.h) * (s ? BELT.cz : -BELT.cz);
        app.spawnP(bx + ox + (Math.random()-0.5)*0.5, 0.12, bz + oz + (Math.random()-0.5)*0.5,
          -Math.cos(sim.h) * 0.8 + (Math.random()-0.5), 0.4 + Math.random() * 0.5, Math.sin(sim.h) * 0.8 + (Math.random()-0.5),
          0.45 + Math.random() * 0.5, 0.7 + Math.random() * 0.4, 0.42, 0.37, 0.29, 0.22, 0.4);
      }
    }
  }
  if (!app.reduced) {
    exTimer -= dt;
    if (exTimer <= 0) {
      exTimer = 0.14;
      var sp = stackWorld(_wpF);
      app.spawnP(sp[0], sp[1], sp[2],
        (Math.random()-0.5) * 0.2, 0.9 + Math.random() * 0.4, (Math.random()-0.5) * 0.2,
        0.20 + Math.random() * 0.1, 1.3 + Math.random() * 0.4, 0.32, 0.32, 0.33, 0.16, -0.12);
    }
  }
}

  drawCyl(d1, _wpC, _wpD, 0.115, 0.066);
  /* 铲斗缸（动臂头→摇臂耳，四连杆同步） */
  pt(boomN.world, 5.30, 2.10, 0, _wpA);
  pt(crankN.world, 0.20, 0.34, 0, _wpB);
  drawCyl(d1, _wpA, _wpB, 0.09, 0.052);
  /* 连杆（摇臂耳 → 铲斗耳，定长约束） */
  pt(crankN.world, -0.10, 0.42, 0, _wpC);
  pt(bktN.world, -0.02, 0.55, 0, _wpD);
  drawCyl(d1, _wpC, _wpD, 0.038, 0.038);
  /* 动态软管（随关节运动） */
  /* 软管暂缺 */

}

app.setScene(machine, dynDraw);
app.start();
window.__ld = { sim: sim, machine: machine, upper: upper, boomN: boomN, armN: armN, bktN: bktN, crankN: crankN };
