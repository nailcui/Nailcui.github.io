<title>3D 挖掘机 V2 · Nailcui</title>

<canvas id="gl"></canvas>
<script src="./vehicle3d2.js"></script>
<script>
(function () {
'use strict';
var V = V3D2, PI = V.PI, rad = V.rad, clamp = V.clamp, lerp = V.lerp, nearAng = V.nearAng;
var T = V.T, S = V.S, RX = V.RX, RY = V.RY, RZ = V.RZ;
var m4chain = V.m4chain, m4mul = V.m4mul, m4ident = V.m4ident, pt = V.pt;

/* ---------------- 演示状态 ---------------- */
var demo = { on: false, i: 0, t: 0, done: 0, steps: [], loopFrom: 1 };

var app = V3D2.createApp({
  title: '3D 挖掘机',
  badge: 'HE336 · V2',
  badgeSub: 'HIGH-FIDELITY BUILD',
  v1link: './excavator.html',
  hint: '拖拽旋转 · 滚轮缩放 · WASD 驾驶 · Q/E 回转 · R/F 动臂 · T/G 斗杆 · Z/X 铲斗',
  buttons: [
    { id: 'demo', label: '自动演示', onClick: function () { demo.on ? stopDemo() : startDemo(); } },
    { id: 'orbit', label: '镜头展示' },
    { id: 'follow', label: '跟随镜头' },
    { id: 'view', label: '重置视角' },
    { id: 'help', label: '操作说明' }
  ],
  keys: [
    ['<b>W</b><b>S</b> 行驶', '<b>A</b><b>D</b> 转向', '<b>Q</b><b>E</b> 回转'],
    ['<b>R</b><b>F</b> 动臂', '<b>T</b><b>G</b> 斗杆', '<b>Z</b><b>X</b> 铲斗'],
    ['<b>空格</b> 停止', '<b>⏎</b> 演示', '<b>O</b> 展示 <b>C</b> 跟随'],
    ['<b>V</b> 重置视角', '<b>H</b> 帮助', '']
  ],
  touchRight: [
    ['sl', '左旋'], ['sr', '右旋'],
    ['bu', '升臂'], ['bd', '降臂'],
    ['ai', '收杆'], ['ao', '放杆'],
    ['bc', '收斗'], ['bo', '开斗']
  ],
  help:
    '<h2>操作说明</h2>' +
    '<h4>行 驶</h4>' +
    '<p><b>W</b>/<b>↑</b> 前进 · <b>S</b>/<b>↓</b> 后退 · <b>A</b>/<b>←</b>/<b>D</b>/<b>→</b> 履带差速转向</p>' +
    '<h4>工作装置</h4>' +
    '<p><b>Q</b>/<b>E</b> 上车左/右回转<br><b>R</b>/<b>F</b> 动臂升/降 · <b>T</b>/<b>G</b> 斗杆收/放 · <b>Z</b>/<b>X</b> 铲斗收（挖）/开（卸）</p>' +
    '<h4>镜 头</h4>' +
    '<p>鼠标拖拽旋转 · 滚轮缩放 · <b>O</b> 镜头自动展示 · <b>C</b> 跟随 · <b>V</b> 重置视角</p>' +
    '<h4>其 他</h4>' +
    '<p><b>空格</b> 全部停止 · <b>⏎</b> 自动挖掘演示 · <b>H</b> 本说明</p>' +
    '<h4>触 屏</h4><p>单指拖拽旋转 · 双指缩放 · 底部按钮操控（按住持续动作）</p>',
  cam: { yaw: 0.66, pitch: 0.235, dist: 13.4, ty: 2.35 },
  mound: { x: 7.6, z: -3.0, r: 2.5, h: 1.7 },
  dirt: 0x7a6c55,
  followTarget: function () { return [sim.x, sim.z]; },
  shadowCenter: function () { return [sim.x, 1.5, sim.z]; },
  shadowHalf: 13,
  extraKeys: { KeyQ: 'sl', KeyE: 'sr', KeyR: 'bu', KeyF: 'bd', KeyT: 'ai', KeyG: 'ao', KeyZ: 'bc', KeyX: 'bo' },
  manualExtra: ['sl', 'sr', 'bu', 'bd', 'ai', 'ao', 'bc', 'bo'],
  onStop: function () {
    stopDemo();
    sim.v = 0; sim.w = 0; sim.tv = 0; sim.tw = 0;
    for (var k in sim.JV) sim.JV[k] = 0;
  },
  onEnter: function () { demo.on ? stopDemo() : startDemo(); },
  update: update
});

if (!app) return;
var gl = app.gl;
var key = app.key;
app.cam.tx = 0; app.cam.tz = 2.6;

/* ============================================================
   材质（伪 PBR v2：coat 清漆 / rough 粗糙 / metal 反射 / mud 泥污）
   ============================================================ */
var M_PAINT  = V.Mat(0xf2a816, [0.44,0.40,0.30], 70, { metal: 0.19, mud: 0.10, coat: 0.95, rough: 0.24 });
var M_PAINT2 = V.Mat(0xd69410, [0.32,0.29,0.20], 52, { metal: 0.16, mud: 0.15, coat: 0.60, rough: 0.30 });
var M_CHAR   = V.Mat(0x2c2c31, [0.15,0.15,0.16], 20, { metal: 0.38, mud: 0.34, rough: 0.48 });
var M_BLACK  = V.Mat(0x1b1b1f, [0.18,0.18,0.19], 22, { metal: 0.25, mud: 0.22, rough: 0.80 });
var M_BELT   = V.Mat(0x26262b, [0.07,0.07,0.078], 12, { metal: 0.52, mud: 0.50, rough: 0.55 });
var M_STEEL  = V.Mat(0x4a4c55, [0.55,0.56,0.60], 44, { metal: 0.68, mud: 0.12, rough: 0.30 });
var M_DARKST = V.Mat(0x33353c, [0.32,0.33,0.36], 26, { metal: 0.62, mud: 0.26, rough: 0.42 });
var M_BORON  = V.Mat(0x3b3d44, [0.30,0.31,0.34], 30, { metal: 0.70, mud: 0.30, rough: 0.40 });
var M_CHROME = V.Mat(0xd6dbe6, [1.55,1.55,1.48], 140, { metal: 0.98, mud: 0.0, rough: 0.05 });
var M_GLASS  = V.Mat(0x27333e, [1.9,2.0,2.1], 160, { alpha: 0.55, metal: 0.84, mud: 0, rough: 0.08 });
var M_RUBBER = V.Mat(0x161618, [0.04,0.04,0.04], 8, { metal: 0.03, mud: 0.30, rough: 0.95 });
var M_GRILL  = V.Mat(0x1f2023, [0.10,0.10,0.11], 14, { metal: 0.30, mud: 0.20, rough: 0.70 });
var M_SEAT   = V.Mat(0x2e3138, [0.05,0.05,0.05], 8, { metal: 0.05, rough: 0.9, mud: 0 });
var M_LAMP   = V.Mat(0x8a8d92, [0.25,0.25,0.25], 30, { emis: 0xfff4cc, emisK: 1.7, metal: 0.2, mud: 0.05, rough: 0.2 });
var M_BEACON = V.Mat(0xa04400, [0.12,0.06,0.02], 12, { emis: 0xff8830, emisK: 1.15, metal: 0.1, mud: 0, rough: 0.3 });
var texStripe = app.makeStripeTex();
var M_STRIPE = { color: [1,1,1], spec: [0.2,0.2,0.2], shin: 24, emis: [0,0,0], alpha: 1, tex: texStripe, cut: 0.45, metal: 0.12, mud: 0.22, coat: 0.3, rough: 0.4 };
var M_LABEL  = { color: [1,1,1], spec: [0.1,0.1,0.1], shin: 20, emis: [0,0,0], alpha: 1, tex: app.texLabel, cut: 0.45, metal: 0.1, mud: 0.18, coat: 0.2, rough: 0.5 };
var M_WARN   = { color: [1,1,1], spec: [0.12,0.12,0.12], shin: 20, emis: [0,0,0], alpha: 1, tex: app.texWarn, cut: 0.45, metal: 0.1, mud: 0.18, rough: 0.5 };

/* ---------------- 单位网格与液压缸/软管 ---------------- */
var gUnitCyl = new V.Geo(); gUnitCyl.cyl(m4ident(), 1, 1, 1, 14, true);
var meshUnitCyl = app.makeMesh(gUnitCyl);
var gUnitSph = new V.Geo(); gUnitSph.sphere(m4ident(), 1, 10, 8);
var meshUnitSph = app.makeMesh(gUnitSph);
var _cylM = m4ident(), _tubeM = m4ident(), _barM = m4ident();
var drawCyl = V.makeCylHelper2(meshUnitCyl, meshUnitSph, _cylM);
var drawTube = V.makeTubeHelper2(meshUnitCyl, meshUnitSph, _tubeM);
/* 定长连杆（摇臂→铲斗耳） */
var _barDir = [0, 0, 0];
function drawBar(d1, A, B, r) {
  var dx = B[0]-A[0], dy = B[1]-A[1], dz = B[2]-A[2];
  var L = Math.hypot(dx, dy, dz) || 1;
  var d = _barDir;
  d[0]=dx/L; d[1]=dy/L; d[2]=dz/L;
  var rx = 0, ry = 1, rz = 0;
  if (Math.abs(d[1]) > 0.95) { rx = 1; ry = 0; }
  var cx = ry*d[2]-rz*d[1], cy = rz*d[0]-rx*d[2], cz2 = rx*d[1]-ry*d[0];
  var cl = Math.hypot(cx,cy,cz2)||1; cx/=cl; cy/=cl; cz2/=cl;
  var zx = cy*d[2]-cz2*d[1], zy = cz2*d[0]-cx*d[2], zz = cx*d[1]-cy*d[0];
  var m = _barM;
  m[0]=cx*r; m[1]=cy*r; m[2]=cz2*r; m[3]=0;
  m[4]=d[0]*L; m[5]=d[1]*L; m[6]=d[2]*L; m[7]=0;
  m[8]=zx*r; m[9]=zy*r; m[10]=zz*r; m[11]=0;
  m[12]=A[0]+dx/2; m[13]=A[1]+dy/2; m[14]=A[2]+dz/2; m[15]=1;
  d1(meshUnitCyl, 'bar', m);
}
function drawOneFactory(prog, depth) {
  return function (mesh, kind, model) {
    if (depth) {
      app.useProg(prog);
      V.bindMesh(prog, mesh);
      gl.uniformMatrix4fv(prog.u.uModel, false, model);
      gl.drawElements(gl.TRIANGLES, mesh.n, gl.UNSIGNED_SHORT, 0);
    } else {
      var mat;
      switch (kind) {
        case 'rod': mat = M_CHROME; break;
        case 'gland': mat = M_STEEL; break;
        case 'eye': mat = M_CHAR; break;
        case 'joint': mat = M_STEEL; break;
        case 'tube': mat = M_RUBBER; break;
        case 'bar': mat = M_STEEL; break;
        default: mat = M_DARKST;
      }
      app.drawMat(prog, mesh, mat, model);
    }
  };
}

/* ---------------- 机器状态 ---------------- */
var SPAWN = { x: 0, z: 2.6, h: 0.48 };
var PARK = { boom: rad(9), arm: rad(123), bucket: rad(77) };
var sim = {
  x: SPAWN.x, z: SPAWN.z, h: SPAWN.h,
  v: 0, w: 0, tv: 0, tw: 0,
  distL: 0, distR: 0,
  J: { swing: 0, boom: PARK.boom, arm: PARK.arm, bucket: PARK.bucket },
  JV: { swing: 0, boom: 0, arm: 0, bucket: 0 },
  pitch: 0, roll: 0, bobY: 0
};
var VMAX = 1.9, WMAX = 0.8;
var LIMIT = { boom: [-0.38, 0.92], arm: [-2.05, 2.28], bucket: [-0.28, 2.62] };
var RATE = { boom: 0.40, arm: 0.52, bucket: 0.80, swing: 0.58 };

/* ---------------- 履带参数 ---------------- */
/* 节线 = 顶点着色器路径线；履带节点抬高 0.112：抓地齿尖刚好咬地 */
var BELT = { Lb: 3.40, R: 0.52, W: 0.68, N: 48, cz: 1.10, lift: 0.112 };
var beltMesh;
(function () {
  var b = V.buildBeltGeo2(BELT.Lb, BELT.R, BELT.W, BELT.N);
  BELT.total = b.total;
  beltMesh = app.makeBeltMesh(b.geo);
})();

/* ============================================================
   节点树：machine → chassis / trackL / trackR / upper → boom → arm → bucket
   ============================================================ */
var machine = new V.Node(null, m4ident());
var chassis = new V.Node(machine, m4ident());
var trackL = new V.Node(machine, T(0, BELT.lift, BELT.cz));
var trackR = new V.Node(machine, T(0, BELT.lift, -BELT.cz));
var upper = new V.Node(machine, m4ident());
var boomN = new V.Node(upper, m4ident());
var armN = new V.Node(boomN, m4ident());
var bktN = new V.Node(armN, m4ident());
var crankN = new V.Node(armN, m4ident());

/* 沿 X 长圆柱销（法向 Z）：杆体 + 两端盖 + 4 螺栓 */
function pinX(g, x, y, z, r, len, seg) {
  seg = seg || 10;
  g.cyl(m4chain(T(x, y, z), RX(PI / 2)), r, r, len, seg, true);
  [1, -1].forEach(function (s) {
    g.cyl(m4chain(T(x, y, z + s * (len / 2 + 0.012)), RX(PI / 2)), r * 1.42, r * 1.42, 0.026, seg, true);
    for (var k = 0; k < 4; k++) {
      var a = k / 4 * 2 * PI + 0.4;
      g.cyl(m4chain(T(x + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62, z + s * (len / 2 + 0.016)), RX(PI / 2)), 0.012, 0.012, 0.012, 5, true);
    }
  });
}
/* 小螺栓排（沿 Z 面法向）——预留 */

/* ============================================================
   底盘：履带架放样梁 + 挡泥板 + 张紧机构 + 中央车架 + 回转齿圈
   ============================================================ */
(function () {
  var gp = new V.Geo();  /* 漆面 */
  var gd = new V.Geo();  /* 深色件 */
  [1, -1].forEach(function (sg) {
    var mSide = m4chain(T(0, 0, sg * BELT.cz), RY(sg > 0 ? 0 : PI));
    /* 上翘履带架放样梁 */
    gp.loft(mSide, [
      { x: -2.02, y: 0.72, w: 0.30, h: 0.40, r: 0.32 },
      { x: -1.72, y: 0.60, w: 0.30, h: 0.46, r: 0.32 },
      { x: -0.90, y: 0.56, w: 0.30, h: 0.48, r: 0.32 },
      { x:  0.90, y: 0.56, w: 0.30, h: 0.48, r: 0.32 },
      { x:  1.72, y: 0.60, w: 0.30, h: 0.46, r: 0.32 },
      { x:  2.02, y: 0.72, w: 0.30, h: 0.40, r: 0.32 }
    ]);
    /* 挡泥板（链轨上方，前低后高，带防滑棱） */
    gp.box(m4chain(T(-0.5, 1.235, sg * BELT.cz), RX(sg > 0 ? rad(2.2) : rad(-2.2))), 1.30, 0.022, W2() * 0.94);
    gp.box(m4chain(T(1.05, 1.25, sg * BELT.cz), RX(sg > 0 ? rad(-3) : rad(3))), 0.72, 0.022, W2() * 0.94);
    for (var rb = 0; rb < 7; rb++) {
      gp.box(T(-1.05 + rb * 0.34, 1.262, sg * BELT.cz), 0.05, 0.012, W2() * 0.8);
    }
    /* 挡泥板侧沿 */
    gp.box(T(-0.5, 1.19, sg * (BELT.cz + W2() * 0.47)), 2.02, 0.10, 0.022);
    /* 张紧机构：护罩 + 张紧杆（连接引导轮支架） */
    gd.box(m4chain(T(1.86, 0.66, sg * BELT.cz), RZ(rad(-6))), 0.30, 0.30, 0.24);
    gd.cyl(m4chain(T(1.62, 0.56, sg * BELT.cz), RZ(rad(90))), 0.055, 0.055, 0.34, 8, true);
    /* 驱动轮护罩（尾部） */
    gd.box(m4chain(T(-1.86, 0.78, sg * BELT.cz), RZ(rad(8))), 0.26, 0.26, 0.28);
    /* 支重轮（7 组双缘，静置合并；轴头 + 托架） */
    for (var i = 0; i < 7; i++) {
      var rx = -1.40 + i * 0.4667;
      gd.cyl(m4chain(T(rx, 0.292, sg * BELT.cz), RX(PI / 2)), 0.075, 0.075, 0.30, 8, true);
      [1, -1].forEach(function (s2) {
        gd.cyl(m4chain(T(rx, 0.292, sg * (BELT.cz + s2 * 0.075)), RX(PI / 2)), 0.24, 0.24, 0.075, 12, true);
        gd.cyl(m4chain(T(rx, 0.292, sg * (BELT.cz + s2 * 0.125)), RX(PI / 2)), 0.272, 0.272, 0.024, 12, true);
      });
      gd.box(T(rx, 0.40, sg * BELT.cz), 0.10, 0.14, 0.24);
    }
    /* 托链轮 ×2 */
    [0.85, -0.85].forEach(function (cx2) {
      gd.box(T(cx2, 0.74, sg * BELT.cz), 0.10, 0.16, 0.16);
      gd.cyl(m4chain(T(cx2, 0.833, sg * BELT.cz), RX(PI / 2)), 0.155, 0.155, 0.085, 10, true);
      gd.cyl(m4chain(T(cx2, 0.833, sg * (BELT.cz + 0.062)), RX(PI / 2)), 0.185, 0.185, 0.022, 10, true);
    });
  });
  function W2() { return BELT.W; }
  /* 中央车架：X 撑 + 轴座 + 底护板 */
  gp.box(m4chain(T(0, 0.62, 0.42), RY(rad(28))), 1.15, 0.14, 0.20);
  gp.box(m4chain(T(0, 0.62, -0.42), RY(rad(-28))), 1.15, 0.14, 0.20);
  gp.box(T(0, 0.86, 0), 0.72, 0.30, 0.62);
  gd.box(T(0, 0.36, 0), 1.35, 0.05, 0.92);
  /* 回转齿圈座（内齿圈，随上车转动）——底座 */
  gd.cyl(T(0, 1.00, 0), 0.80, 0.86, 0.10, 22, true);
  chassis.add(gl, gp, M_PAINT2);
  chassis.add(gl, gd, M_CHAR);
})();

/* 回转支承外齿圈（挂在 upper 上，随上车转） */
(function () {
  var gd = new V.Geo();
  gd.cyl(T(0, 0.015, 0), 0.97, 0.97, 0.11, 26, true);
  for (var i = 0; i < 18; i++) {
    var a = i / 18 * 2 * PI;
    gd.box(m4chain(T(Math.cos(a) * 1.015, 0.015, Math.sin(a) * 1.015), RY(-a)), 0.055, 0.09, 0.075);
  }
  for (i = 0; i < 16; i++) {
    var a2 = i / 16 * 2 * PI + 0.2;
    gd.cyl(m4chain(T(Math.cos(a2) * 0.90, 0.075, Math.sin(a2) * 0.90), RX(PI / 2)), 0.02, 0.02, 0.03, 5, true);
  }
  upper.add(gl, gd, M_DARKST);
})();

/* ============================================================
   上车：平台 / 配重 / 机舱 / 驾驶室 / 扶手 / 踏板 / 阀组
   ============================================================ */
(function () {
  var gy = new V.Geo();   /* 工程漆 */
  var gd = new V.Geo();   /* 深色结构件 */
  var gs = new V.Geo();   /* 钢件 */
  var gg = new V.Geo();   /* 玻璃 */
  var gi = new V.Geo();   /* 内饰 */
  var ge = new V.Geo();   /* 发光件 */
  var gdec = new V.Geo(); /* 贴纸 quads（uv 朝外） */

  /* ---- 主平台：甲板 + 侧裙 ---- */
  gy.rbox(T(-0.42, 0.17, 0), 2.05, 0.075, 1.16, 0.07, 3);
  [1, -1].forEach(function (sg) {
    gy.extrude(T(0, 0, sg * 1.135), [
      [-2.42, 0.10], [-2.30, 0.055], [1.58, 0.16], [1.58, 0.245], [-2.42, 0.245]
    ], 0.045);
  });
  /* 甲板防滑棱（走道区） */
  for (var rib = 0; rib < 6; rib++) {
    gy.box(T(-0.25 - rib * 0.16, 0.25, 1.02), 0.06, 0.012, 0.14);
    gy.box(T(-0.25 - rib * 0.16, 0.25, -1.02), 0.06, 0.012, 0.14);
  }

  /* ---- 配重：大圆角主体 + 底部收分 + 后端黑面板 + 检修格栅 ---- */
  gy.rbox(T(-1.98, 0.04, 0), 0.53, 0.585, 1.26, 0.17, 4);
  gy.extrude(T(0, 0, 0), [
    [-2.50, -0.44], [-2.28, -0.50], [-1.42, -0.22], [-1.46, 0.30], [-2.50, 0.30]
  ], 2.36);
  gd.box(T(-2.505, 0.10, 0), 0.022, 0.55, 1.02);
  for (var gri = 0; gri < 3; gri++) {
    gd.box(T(-2.519, -0.02 + gri * 0.15, 0), 0.012, 0.045, 0.92);
  }
  /* 吊装耳 ×2 + 尾部拖车钩 */
  [1, -1].forEach(function (sg) {
    gs.box(T(-2.28, 0.60, sg * 0.86), 0.10, 0.09, 0.16);
    gs.cyl(m4chain(T(-2.28, 0.615, sg * 0.86), RX(PI / 2)), 0.052, 0.052, 0.19, 8, true);
    gd.box(T(-2.42, -0.36, sg * 0.15), 0.10, 0.14, 0.05);
  });
  pinX(gd, -2.42, -0.36, 0, 0.045, 0.40, 8);

  /* ---- 发动机舱：主体 + 侧检修门（铰链/拉手/锁扣）+ 顶盖 + 格栅 ---- */
  gy.rbox(T(-0.58, 0.46, -0.24), 0.86, 0.22, 0.62, 0.08, 3);
  gy.rbox(T(0.10, 0.40, -0.24), 0.24, 0.15, 0.52, 0.06, 3);

  bktN.add(gl, gd, M_BORON);
})();

/* 摇臂（bellcrank，双板 + 端部轴套）：连杆臂朝前下 (0.30,-0.28)，缸杆臂朝后上 (-0.15,0.30) */
(function () {
  var gy = new V.Geo(), gd = new V.Geo();
  [1, -1].forEach(function (sg) {
    gy.extrude(m4chain(T(0, 0, sg * 0.058), RY(0)), [
      [0.00, -0.07], [-0.06, -0.10], [0.28, -0.42], [0.36, -0.33]
    ], 0.036);
    gy.extrude(m4chain(T(0, 0, sg * 0.058), RY(0)), [
      [0.00, 0.07], [0.05, 0.11], [-0.14, 0.47], [-0.24, 0.40]
    ], 0.036);
  });
  gy.cyl(m4chain(T(0, 0, 0), RX(PI / 2)), 0.065, 0.065, 0.44, 10, true);
  gy.cyl(m4chain(T(0.30, -0.28, 0), RX(PI / 2)), 0.052, 0.052, 0.16, 8, true);
  gy.cyl(m4chain(T(-0.15, 0.30, 0), RX(PI / 2)), 0.048, 0.048, 0.15, 8, true);
  gd.cyl(m4chain(T(0.30, -0.28, 0.098), RX(PI / 2)), 0.026, 0.026, 0.03, 6, true);
  gd.cyl(m4chain(T(-0.15, 0.30, -0.088), RX(PI / 2)), 0.026, 0.026, 0.03, 6, true);
  crankN.add(gl, gy, M_PAINT2);
  crankN.add(gl, gd, M_STEEL);
})();

/* ============================================================
   四连杆解算：铲斗角 → 摇臂角（连杆定长，圆-圆交点）
   摇臂连杆耳 (0.30,-0.28) 朝前下、缸杆耳 (-0.15,0.30) 朝后上（双臂 ~160°）。
   支路判据：取 x 较大的交点（贴斗杆前侧）。与 /tmp 数值验证一致：
   全角度域可达、连杆实长恒 0.62、摇臂角 1°~101°。
   ============================================================ */
var CRANK_LINK = [0.30, -0.28];
var CRANK_ROD = [-0.15, 0.30];
var LINK_L = 0.62;
var LINK_R = Math.hypot(CRANK_LINK[0], CRANK_LINK[1]);
var ANG0 = Math.atan2(CRANK_LINK[1], CRANK_LINK[0]);
function solveCrank(bkt) {
  /* 铲斗耳（arm 局部）：铰点 (2.92,0.10) + 旋转耳向量 (-0.14,0.28) */
  var c = Math.cos(bkt), s = Math.sin(bkt);
  var ex = 2.92 + (-0.14 * c - 0.28 * s);
  var ey = 0.10 + (-0.14 * s + 0.28 * c);
  var dx = ex - 2.66, dy = ey - 0.68;
  var dl = Math.hypot(dx, dy) || 1;
  if (dl > LINK_R + LINK_L - 0.004) {
    var k = (LINK_R + LINK_L - 0.004) / dl; dx *= k; dy *= k; dl *= k;
  } else if (dl < Math.abs(LINK_R - LINK_L) + 0.004) {
    var k2 = (Math.abs(LINK_R - LINK_L) + 0.004) / dl; dx *= k2; dy *= k2; dl *= k2;
  }
  var a = (LINK_R * LINK_R + dl * dl - LINK_L * LINK_L) / (2 * dl);
  var h = Math.sqrt(Math.max(LINK_R * LINK_R - a * a, 0));
  var ux = dx / dl, uy = dy / dl;
  /* 两个候选交点，取 x 较大者（前支路，避免摇臂翻转） */
  var x1 = a * ux - h * uy, y1 = a * uy + h * ux;
  var x2 = a * ux + h * uy, y2 = a * uy - h * ux;
  var cx = (x1 >= x2) ? x1 : x2;
  var cy = (x1 >= x2) ? y1 : y2;
  return Math.atan2(cy, cx) - ANG0;
}

/* ---------------- 特效锚点 ---------------- */
var _wp = [];
for (var _wi = 0; _wi < 10; _wi++) _wp.push([0, 0, 0]);
function W(i) { return _wp[i]; }
function bucketEdgeWorld(out) {
  return pt(bktN.world, 1.05, -0.62, 0, out || [0, 0, 0]);
}
function stackWorld(out) {
  return pt(upper.world, -1.26, 1.11, -0.52, out || [0, 0, 0]);
}

/* ---------------- 演示 ---------------- */
function stopDemo() { demo.on = false; app.setBtnOn('demo', false); }
function startDemo() {
  var dx = app.mound.x - sim.x, dz = app.mound.z - sim.z;
  var psi = Math.atan2(-dz, dx);
  var phiPile = nearAng(sim.J.swing, psi - sim.h + rad(4));
  var phiDump = nearAng(sim.J.swing, psi - sim.h - rad(146));
  demo.steps = [
    { drive: 2.0, dur: 3.2 },
    { j: { boom: rad(-16), arm: rad(-106), bucket: rad(-8), swing: phiPile }, mt: 11 },
    { j: { bucket: rad(132) }, mt: 3.2, dig: true },
    { j: { boom: rad(8), arm: rad(-58), bucket: rad(124) }, mt: 4.5 },
    { j: { swing: phiDump }, mt: 5 },
    { j: { bucket: rad(-14), arm: rad(-92) }, mt: 3, dump: true },
    { j: { boom: rad(-12), arm: rad(98), bucket: rad(108) }, mt: 4.5 },
    { drive: -2.0, dur: 3.2 },
    { j: { swing: phiPile }, mt: 5 }
  ];
  demo.on = true; demo.i = 0; demo.t = 0; demo.done = 0;
  app.setBtnOn('demo', true);
}
function resetAll() {
  stopDemo();
  sim.x = SPAWN.x; sim.z = SPAWN.z; sim.h = SPAWN.h;
  sim.v = 0; sim.w = 0; sim.tv = 0; sim.tw = 0;
  sim.J.swing = 0; sim.J.boom = PARK.boom; sim.J.arm = PARK.arm; sim.J.bucket = PARK.bucket;
  for (var k in sim.JV) sim.JV[k] = 0;
  app.cam.tx = SPAWN.x; app.cam.tz = SPAWN.z;
  app.camReset();
}
function demoStepAdvance() {
  demo.i++;
  if (demo.i >= demo.steps.length) demo.i = demo.loopFrom;
  demo.t = 0; demo.done = 0;
  var st = demo.steps[demo.i];
  if (st.j && st.j.swing !== undefined) st.j.swing = nearAng(sim.J.swing, st.j.swing);
}
function updateDemo(dt) {
  if (!demo.on) return;
  var st = demo.steps[demo.i];
  if (!st) { stopDemo(); return; }
  demo.t += dt;
  if (st.drive !== undefined) {
    demo.done += sim.v * dt;
    var rem = st.drive - demo.done;
    var tmax = Math.max(0.4, st.dur - demo.t);
    sim.tv = clamp(rem / tmax * 1.35, -VMAX, VMAX);
    sim.tw = 0;
    if (Math.abs(rem) < 0.1 || demo.t > st.dur + 1.5) demoStepAdvance();
  } else if (st.j) {
    sim.tv = 0; sim.tw = 0;
    var all = true;
    for (var k in st.j) {
      var target = st.j[k];
      var d = target - sim.J[k];
      if (Math.abs(d) > 0.015) all = false;
      var v = clamp(d / Math.max(dt, 1e-4), -RATE[k], RATE[k]);
      sim.JV[k] = lerp(sim.JV[k], v * Math.min(1, Math.abs(d) / 0.12 + 0.12), Math.min(1, dt * 14));
    }
    if (st.dig || st.dump) digDumpFx(dt, st);
    if (all || demo.t > st.mt) demoStepAdvance();
  }
}
var digTimer = 0, dumpTimer = 0, dustTimer = 0, exTimer = 0, stampAcc = 0;
var EDGE = [0, 0, 0];
function digDumpFx(dt, st) {
  bucketEdgeWorld(EDGE);
  if (st.dig) {
    var mh = app.moundH(EDGE[0], EDGE[2]);
    if (sim.JV.bucket > 0.1 && EDGE[1] < mh + 0.5 && EDGE[1] > mh - 1.6) {
      var n = 2 + (Math.random() * 3 | 0);
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 2 * PI;
        app.spawnP(EDGE[0] + (Math.random()-0.5)*0.35, EDGE[1] + Math.random()*0.25, EDGE[2] + (Math.random()-0.5)*0.35,
          Math.cos(a) * (0.5 + Math.random()), 1.1 + Math.random() * 2.1, Math.sin(a) * (0.5 + Math.random()),
          0.10 + Math.random() * 0.18, 0.5 + Math.random() * 0.5, 0.26, 0.21, 0.15, 0.85, 5.5);
      }
      digTimer -= dt;
      if (digTimer <= 0) { digTimer = 0.12; app.stampBlob(EDGE[0], EDGE[2], 0.55, 0.22); }
    }
  }
  if (st.dump && sim.J.bucket < rad(8)) {
    dumpTimer -= dt;
    if (dumpTimer <= 0) {
      dumpTimer = 0.045;
      for (var j = 0; j < 3; j++) {
        app.spawnP(EDGE[0] + (Math.random()-0.5)*0.5, EDGE[1] + 0.25, EDGE[2] + (Math.random()-0.5)*0.5,
          (Math.random()-0.5)*0.6, -0.4, (Math.random()-0.5)*0.6,
          0.12 + Math.random() * 0.16, 0.6 + Math.random() * 0.4, 0.27, 0.22, 0.16, 0.85, 6);
      }
    }
  }
}

/* ============================================================
   每帧更新：驾驶 / 关节 / 重量感姿态 / 接触阴影 / 特效
   ============================================================ */
var _machineM = m4ident();
function update(dt, t) {
  if (!demo.on) {
    sim.tv = ((key.f ? 1 : 0) - (key.b ? 1 : 0)) * VMAX;
    sim.tw = ((key.r ? 1 : 0) - (key.l ? 1 : 0)) * WMAX;
  }
  var av = 2.2, aw = 3.0;
  var accV = clamp((sim.tv - sim.v) * 3, -1, 1);
  sim.v += clamp(sim.tv - sim.v, -av * dt, av * dt);
  sim.w += clamp(sim.tw - sim.w, -aw * dt, aw * dt);
  sim.x += Math.cos(sim.h) * sim.v * dt;
  sim.z += -Math.sin(sim.h) * sim.v * dt;
  sim.h += sim.w * dt;
  var sl = sim.v + sim.w * BELT.cz, sr = sim.v - sim.w * BELT.cz;
  sim.distL += sl * dt;
  sim.distR += sr * dt;
  sim.x = clamp(sim.x, -110, 110);
  sim.z = clamp(sim.z, -110, 110);

  if (!demo.on) {
    var dirs = {
      boom: (key.bu ? 1 : 0) - (key.bd ? 1 : 0),
      arm: (key.ai ? 1 : 0) - (key.ao ? 1 : 0),
      bucket: (key.bc ? 1 : 0) - (key.bo ? 1 : 0),
      swing: (key.sr ? 1 : 0) - (key.sl ? 1 : 0)
    };
    for (var j in dirs) {
      sim.JV[j] = lerp(sim.JV[j], dirs[j] * RATE[j], Math.min(1, dt * 11));
    }
  }
  for (j in sim.J) sim.J[j] += sim.JV[j] * dt;
  for (j in LIMIT) {
    if (sim.J[j] < LIMIT[j][0]) { sim.J[j] = LIMIT[j][0]; if (sim.JV[j] < 0) sim.JV[j] = 0; }
    if (sim.J[j] > LIMIT[j][1]) { sim.J[j] = LIMIT[j][1]; if (sim.JV[j] > 0) sim.JV[j] = 0; }
  }
  /* 怠速动臂液压缓慢下沉 */
  if (!demo.on && !key.bu && !key.bd && sim.J.boom > 0.02) {
    sim.J.boom = Math.max(0.02, sim.J.boom - 0.0022 * dt);
  }
  updateDemo(dt);

  /* 重量感：行驶加减速俯仰 + 回转惯性侧倾 + 路面颠簸 */
  var tPitch = clamp(accV * 0.014, -0.014, 0.014) + clamp(sim.JV.boom * 0.012, -0.010, 0.010);
  var tRoll = clamp(-sim.w * 0.020 - sim.JV.swing * 0.012, -0.016, 0.016);
  sim.pitch = lerp(sim.pitch, tPitch, Math.min(1, dt * 3));
  sim.roll = lerp(sim.roll, tRoll, Math.min(1, dt * 3));
  var spd = Math.abs(sim.v) + Math.abs(sim.w) * 1.4;
  sim.bobY = app.reduced ? 0 : (Math.sin(sim.distL * 2.6) * 0.006 + Math.sin(sim.distR * 2.9) * 0.006) * Math.min(spd, 1);

  var throttle = Math.abs(sim.v) / VMAX;
  var bob = app.reduced ? 0 : (0.005 + 0.009 * throttle) * Math.sin(t * 36) + 0.0035 * Math.sin(t * 23.3);
  m4mul(T(sim.x, sim.bobY, sim.z), m4mul(RY(sim.h), m4mul(RZ(sim.pitch), RX(sim.roll))), _machineM);
  machine.world = _machineM;
  chassis.local = m4ident();
  trackL.local = T(0, BELT.lift, BELT.cz);
  trackR.local = T(0, BELT.lift, -BELT.cz);
  upper.local = m4mul(RY(sim.J.swing), T(0, bob, 0));
  boomN.local = m4mul(T(0.62, 0.72, 0), RZ(sim.J.boom));
  armN.local = m4mul(T(5.60, 1.55, 0), RZ(sim.J.arm));
  bktN.local = m4mul(T(2.92, 0.10, 0), RZ(sim.J.bucket));
  crankN.local = m4mul(T(2.66, 0.68, 0), RZ(solveCrank(sim.J.bucket)));
  chassis.update(_machineM);
  trackL.update(_machineM);
  trackR.update(_machineM);
  upper.update(_machineM);

  /* 接触阴影：整机软影 + 两条履带条影 */
  var sxo = Math.sin(sim.h), czo = Math.cos(sim.h);
  app.setContacts([
    [sim.x, sim.z, sim.h, 5.5, 3.7, 0.36],
    [sim.x + sxo * BELT.cz, sim.z + czo * BELT.cz, sim.h, 1.05, 5.1, 0.36],
    [sim.x - sxo * BELT.cz, sim.z - czo * BELT.cz, sim.h, 1.05, 5.1, 0.36]
  ]);
  app.updateParts(dt);
  app.uploadDecal(t);

  var moving = Math.abs(sim.v) > 0.15 || Math.abs(sim.w) > 0.2;
  if (moving) {
    stampAcc += Math.max(Math.abs(sl), Math.abs(sr)) * dt;
    if (stampAcc > 0.16) {
      stampAcc = 0;
      app.stampRect(sim.x + sxo * BELT.cz, sim.z + czo * BELT.cz, sim.h, BELT.W, 0.42, 0.05);
      app.stampRect(sim.x - sxo * BELT.cz, sim.z - czo * BELT.cz, sim.h, BELT.W, 0.42, 0.05);
    }
  }
  if (!app.reduced && (Math.abs(sim.v) > 0.55 || Math.abs(sim.w) > 0.5)) {
    dustTimer -= dt;
    if (dustTimer <= 0) {
      dustTimer = 0.06;
      for (var s2 = 0; s2 < 2; s2++) {
        var bx = sim.x - Math.cos(sim.h) * 1.8;
        var bz = sim.z + Math.sin(sim.h) * 1.8;
        var ox = sxo * (s2 ? BELT.cz : -BELT.cz);
        var oz = czo * (s2 ? BELT.cz : -BELT.cz);
        app.spawnP(bx + ox + (Math.random()-0.5)*0.5, 0.12, bz + oz + (Math.random()-0.5)*0.5,
          -Math.cos(sim.h) * 0.8 + (Math.random()-0.5), 0.4 + Math.random() * 0.5, Math.sin(sim.h) * 0.8 + (Math.random()-0.5),
          0.45 + Math.random() * 0.5, 0.7 + Math.random() * 0.4, 0.42, 0.37, 0.29, 0.22, 0.4);
      }
    }
  }
  if (!app.reduced) {
    exTimer -= dt;
    if (exTimer <= 0) {
      exTimer = 0.12;
      var sp = stackWorld(W(9));
      app.spawnP(sp[0], sp[1], sp[2],
        (Math.random()-0.5) * 0.2, 0.9 + Math.random() * 0.4, (Math.random()-0.5) * 0.2,
        0.26 + Math.random() * 0.12, 1.4 + Math.random() * 0.4, 0.34, 0.34, 0.35, 0.22, -0.12);
    }
  }
}

/* ============================================================
   动态绘制：履带 / 驱动轮引导轮 / 液压缸 / 连杆 / 软管
   ============================================================ */
var meshSprocket, meshIdler;
(function () {
  var gs = new V.Geo();
  gs.cyl(RX(PI/2), 0.17, 0.17, 0.32, 12, true);
  [1, -1].forEach(function (s) {
    gs.cyl(m4chain(T(0, 0, s * 0.10), RX(PI/2)), 0.36, 0.36, 0.085, 14, true);
  });
  for (var i = 0; i < 11; i++) {
    var a = i / 11 * 2 * PI;
    gs.box(m4chain(T(Math.cos(a) * 0.435, Math.sin(a) * 0.435, 0), RZ(a)), 0.085, 0.10, 0.155);
  }
  for (i = 0; i < 8; i++) {
    var a2 = i / 8 * 2 * PI + 0.39;
    gs.cyl(m4chain(T(Math.cos(a2) * 0.26, Math.sin(a2) * 0.26, 0.17), RX(PI/2)), 0.016, 0.016, 0.02, 5, true);
  }
  meshSprocket = app.makeMesh(gs);
  var gi = new V.Geo();
  gi.cyl(RX(PI/2), 0.20, 0.20, 0.30, 12, true);
  gi.cyl(RX(PI/2), 0.495, 0.495, 0.115, 16, true);
  [1, -1].forEach(function (s) {
    gi.cyl(m4chain(T(0, 0, s * 0.135), RX(PI/2)), 0.545, 0.545, 0.028, 16, true);
  });
  gi.box(T(0, 0.42, 0), 0.12, 0.24, 0.16);
  meshIdler = app.makeMesh(gi);
})();

function drawWheel(prog, mesh, mm, mat, depth) {
  if (depth) {
    app.useProg(prog);
    V.bindMesh(prog, mesh);
    app.gl.uniformMatrix4fv(prog.u.uModel, false, mm);
    app.gl.drawElements(app.gl.TRIANGLES, mesh.n, app.gl.UNSIGNED_SHORT, 0);
  } else {
    app.drawMat(prog, mesh, mat, mm);
  }
}
function dynDraw(prog, depth, isBeltProg) {
  var d1 = drawOneFactory(prog, depth);
  if (isBeltProg) {
    [trackL, trackR].forEach(function (tn, i) {
      V.drawBelt2(app, beltMesh, tn.world, i === 0 ? sim.distL : sim.distR, BELT.Lb, BELT.R, null, true);
    });
    return;
  }
  [trackL, trackR].forEach(function (tn, i) {
    V.drawBelt2(app, beltMesh, tn.world, i === 0 ? sim.distL : sim.distR, BELT.Lb, BELT.R, M_BELT, false);
  });
  [1, -1].forEach(function (sg) {
    var travel = sg > 0 ? sim.distL : sim.distR;
    drawWheel(prog, meshSprocket, m4chain(machine.world, T(-1.70, 0.52, sg * BELT.cz), RZ(-travel / 0.435)), M_CHAR, depth);
    drawWheel(prog, meshIdler, m4chain(machine.world, T(1.70, 0.52, sg * BELT.cz), RZ(-travel / 0.495)), M_CHAR, depth);
  });
  /* 动臂缸 ×2（上车底座 → 动臂中耳，定长缸筒） */
  [1, -1].forEach(function (sg, idx) {
    pt(upper.world, 0.98, 0.30, sg * 0.60, W(0));
    pt(boomN.world, 1.95, -0.55, sg * 0.36, W(1));
    drawCyl(d1, W(0), W(1), 0.104, 0.064, 1.32);
  });
  /* 斗杆缸（动臂鞍座 → 斗杆上耳） */
  pt(boomN.world, 4.30, 1.02, 0, W(2));
  pt(armN.world, 0.62, 0.38, 0, W(3));
  drawCyl(d1, W(2), W(3), 0.114, 0.068, 1.28);
  /* 铲斗缸（动臂头 → 摇臂缸杆耳，随四连杆解算联动） */
  pt(boomN.world, 5.05, 1.98, 0, W(4));
  pt(crankN.world, -0.15, 0.30, 0, W(5));
  drawCyl(d1, W(4), W(5), 0.094, 0.058, 2.42);
  /* 连杆 ×2（摇臂 → 铲斗耳，定长 0.62 由解算保证） */
  [1, -1].forEach(function (sg) {
    pt(crankN.world, 0.30, -0.28, sg * 0.100, W(6));
    pt(bktN.world, -0.14, 0.28, sg * 0.100, W(7));
    drawBar(d1, W(6), W(7), 0.030);
  });
  /* 动态软管（多段悬链，随关节运动）：
     ① 上车→动臂顶部（主泵到斗杆缸） ② 动臂头→斗杆根（跨过斗杆铰点） ③ 斗杆中部→摇臂（铲斗缸） */
  [1, -1].forEach(function (sg) {
    pt(upper.world, 0.86, 0.30, sg * 0.24, W(0));
    pt(boomN.world, 4.32, 1.16, sg * 0.10, W(1));
    drawTube(d1, W(0), W(1), 0.15, 0.042, sg * 0.12, 3);
    pt(boomN.world, 5.50, 1.90, sg * 0.08, W(2));
    pt(armN.world, 0.30, 0.28, sg * 0.10, W(3));
    drawTube(d1, W(2), W(3), 0.10, 0.040, sg * 0.06, 3);
    pt(armN.world, 1.60, 0.26, sg * 0.10, W(6));
    pt(crankN.world, 0.02, 0.22, sg * 0.12, W(7));
    drawTube(d1, W(6), W(7), 0.07, 0.036, sg * 0.08, 2);
  });
}

app.setScene(machine, dynDraw);
app.start();
window.__ld = {
  sim: sim, machine: machine, chassis: chassis, upper: upper,
  boomN: boomN, armN: armN, bktN: bktN, crankN: crankN,
  solveCrank: solveCrank, app: app
};

})();
