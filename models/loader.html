<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e12">
<meta name="description" content="3D 装载机 —— 铰接转向的重型轮式装载机，手写 WebGL 渲染，零外部资源。">
<title>3D 装载机 · Nailcui</title>
<link rel="stylesheet" href="./vehicle.css">
</head>
<body>
<canvas id="gl"></canvas>
<script src="./vehicle3d.js"></script>
<script>
(function () {
'use strict';
var V = V3D, PI = V.PI, rad = V.rad, clamp = V.clamp, lerp = V.lerp;
var T = V.T, RX = V.RX, RY = V.RY, RZ = V.RZ, m4chain = V.m4chain, m4mul = V.m4mul, pt = V.pt;

/* ---------------- 演示状态 ---------------- */
var demo = { on: false, i: 0, t: 0, done: 0, steps: [], loopFrom: 1 };

var app = V3D.createApp({
  title: '3D 装载机',
  badge: 'WL966',
  badgeSub: 'WHEEL LOADER',
  hint: '拖拽旋转 · 滚轮缩放 · WASD 驾驶 · R/F 举升 · T/G 铲斗',
  buttons: [
    { id: 'demo', label: '自动演示', onClick: function () { demo.on ? stopDemo() : startDemo(); } },
    { id: 'follow', label: '跟随镜头' },
    { id: 'reset', label: '重置', onClick: function () { resetAll(); } },
    { id: 'help', label: '操作说明', onClick: function () { toggleHelp(); } }
  ],
  followBtn: true,
  keys: [
    ['<b>W</b><b>S</b> 行驶', '<b>A</b><b>D</b> 折腰转向', '<b>空格</b> 停止'],
    ['<b>R</b><b>F</b> 举升臂', '<b>T</b><b>G</b> 铲斗', '<b>⏎</b> 演示'],
    ['<b>C</b> 跟随镜头', '<b>H</b> 帮助', '拖拽旋转 · 滚轮缩放']
  ],
  touchRight: [
    ['l', '左转'], ['r', '右转'],
    ['bu', '举臂'], ['bd', '降臂'],
    ['bc', '收斗'], ['bo', '开斗']
  ],
  help:
    '<h2>操作说明</h2>' +
    '<h4>行 驶</h4>' +
    '<p><b>W</b>/<b>↑</b> 前进 · <b>S</b>/<b>↓</b> 后退 · <b>A</b>/<b>←</b>/<b>D</b>/<b>→</b> 折腰转向（前后车架铰接）</p>' +
    '<h4>工作装置</h4>' +
    '<p><b>R</b>/<b>F</b> 举升臂升/降<br><b>T</b>/<b>G</b> 铲斗收（铲料）/翻（卸料）</p>' +
    '<h4>其 他</h4>' +
    '<p><b>空格</b> 全部停止 · <b>⏎</b> 自动铲装演示 · <b>C</b> 跟随镜头 · <b>H</b> 本说明</p>' +
    '<h4>鼠 标</h4><p>拖拽旋转视角 · 滚轮缩放</p>' +
    '<h4>触 屏</h4><p>单指拖拽旋转 · 双指缩放 · 底部按钮操控</p>',
  cam: { yaw: 0.62 + PI - 1.0, pitch: 0.26, dist: 13.0 },
  update: update,
  mound: { x: 9.0, z: -3.2, r: 2.6, h: 1.7 },
  dirt: 0x6d5f49,
  followTarget: function () { return [sim.x, sim.z]; },
  shadowCenter: function () { return [sim.x, 1.4, sim.z]; },
  shadowHalf: 11,
  extraKeys: { KeyR: 'bu', KeyF: 'bd', KeyT: 'bc', KeyG: 'bo' },
  manualExtra: ['bu', 'bd', 'bc', 'bo'],
  onStop: function () {
    stopDemo();
    sim.v = 0; sim.tv = 0; sim.art = 0; sim.artT = 0;
    for (var k in sim.JV) sim.JV[k] = 0;
  },
  onEnter: function () { demo.on ? stopDemo() : startDemo(); }
});

if (!app) return;
var gl = app.gl;
var key = app.key;

/* ---------------- 材质 ---------------- */
var M_YELLOW = V.Mat(0xe8a80c, [0.32,0.28,0.20], 26);
var M_CHAR = V.Mat(0x242428, [0.10,0.10,0.11], 14);
var M_STEEL = V.Mat(0x3a3b42, [0.45,0.46,0.50], 34);
var M_CHROME = V.Mat(0xb8bcc6, [1.15,1.15,1.10], 100);
var M_GLASS = V.Mat(0x24303e, [1.5,1.6,1.7], 130, { alpha: 0.42 });
var M_RUBBER = V.Mat(0x121215, [0.05,0.05,0.05], 10);
var M_STEEL_D = V.Mat(0x50525a, [0.5,0.5,0.55], 40);

/* ---------------- 单位网格与液压缸 ---------------- */
var gUnitCyl = new V.Geo(); gUnitCyl.cyl(V.m4ident(), 1, 1, 1, 14, true);
var meshUnitCyl = app.makeMesh(gUnitCyl);
var gUnitSph = new V.Geo(); gUnitSph.sphere(V.m4ident(), 1, 10, 8);
var meshUnitSph = app.makeMesh(gUnitSph);
var _cylM = V.m4ident();
var drawCyl = V.makeCylHelper(meshUnitCyl, meshUnitSph, _cylM);
function drawOneFactory(prog, depth) {
  return function (mesh, kind, model) {
    if (depth) {
      V.bindMesh(prog, mesh);
      app.gl.uniformMatrix4fv(prog.u.uModel, false, model);
      app.gl.drawElements(app.gl.TRIANGLES, mesh.n, app.gl.UNSIGNED_SHORT, 0);
    } else {
      var mat = kind === 'rod' ? M_CHROME : (kind === 'joint' ? M_CHAR : M_STEEL);
      app.drawMat(prog, mesh, mat, model);
    }
  };
}

/* ---------------- 机器状态 ---------------- */
var SPAWN = { x: 0, z: 3.2, h: 0.62 };
var PARK = { lift: rad(28), rot: rad(55) };
var sim = {
  x: SPAWN.x, z: SPAWN.z, h: SPAWN.h,
  v: 0, tv: 0,
  art: 0, artT: 0,
  J: { lift: PARK.lift, rot: PARK.rot },
  JV: { lift: 0, rot: 0 },
  dist: 0
};
var VMAX = 5.2, L_WB = 3.3;
var ART_MAX = rad(40);
var LIMIT = { lift: [-0.02, 1.15], rot: [-1.95, 1.25] }; /* rot: −112°..+72° */
var RATE = { lift: 0.5, rot: 0.8 };

/* ---------------- 节点树 ---------------- */
var machine = new V.Node(null, V.m4ident());       /* 后车架为根 */
var frontFrame = new V.Node(machine, V.m4ident()); /* 前车架（铰接） */
var liftL = new V.Node(frontFrame, V.m4ident());
var liftR = new V.Node(frontFrame, V.m4ident());
var bktL = new V.Node(liftL, V.m4ident());
var bktR = new V.Node(liftR, V.m4ident());

/* 后车架 */
(function () {
  var gy = new V.Geo(), gd = new V.Geo();
  gd.rbox(T(0, 0.78, 0), 1.45, 0.30, 1.02, 0.08, 3);
  gy.rbox(T(-1.55, 1.42, 0), 1.05, 0.62, 1.08, 0.12, 4);
  gy.rbox(T(-1.35, 2.06, 0), 0.85, 0.06, 0.86, 0.04, 3);
  gd.box(T(-2.58, 1.42, 0), 0.015, 0.42, 0.85);
  [1, -1].forEach(function (sg) {
    gd.box(T(-1.55, 1.30, sg * 1.10), 0.75, 0.30, 0.012);
    for (var i = 0; i < 3; i++) gy.box(T(-1.55, 1.18 + i * 0.13, sg * 1.115), 0.58, 0.035, 0.015);
  });
  gy.rbox(T(-2.62, 1.05, 0), 0.32, 0.55, 1.15, 0.12, 4);
  gd.box(T(-2.62, 0.55, 0), 0.30, 0.08, 1.16);
  gd.cyl(T(-1.1, 2.28, -0.55), 0.07, 0.065, 0.42, 10, true);
  /* 驾驶室 */
  gy.box(T(-0.35, 1.35, 0.62), 0.55, 0.10, 0.55);
  gy.box(T(0.12, 1.95, 0.62), 0.07, 0.55, 0.05);
  gy.box(T(-0.82, 1.95, 0.20), 0.05, 0.55, 0.05);
  gy.box(T(-0.82, 1.95, 1.04), 0.05, 0.55, 0.05);
  gy.rbox(T(-0.35, 2.55, 0.62), 0.50, 0.08, 0.50, 0.04, 3);
  var gg = new V.Geo();
  gg.box(T(0.10, 1.95, 0.62), 0.012, 0.46, 0.42);
  gg.box(T(-0.35, 1.95, 1.10), 0.40, 0.42, 0.012);
  gg.box(T(-0.35, 1.95, 0.14), 0.40, 0.42, 0.012);
  gd.box(T(0.06, 2.60, 0.35), 0.05, 0.035, 0.05);
  gd.box(T(0.06, 2.60, 0.89), 0.05, 0.035, 0.05);
  /* 后桥与铰接耳 */
  gd.cyl(m4chain(T(-1.6, 0.85, 0), RX(PI/2)), 0.16, 0.16, 2.0, 10, true);
  gd.box(T(-1.6, 0.85, 0), 0.30, 0.28, 0.42);
  gd.box(T(-0.12, 0.95, 0), 0.22, 0.20, 0.55);
  gd.box(T(0.1, 1.55, 0), 0.16, 0.14, 0.40);
  /* 铭牌 */
  var lab = new V.Geo();
  function labelQuad(z, flip) {
    var uL = flip ? 1 : 0, uR = flip ? 0 : 1;
    var cx = -2.62, cy = 1.05, w = 0.30, h = 0.15;
    var i00 = lab.vert(V.m4ident(), V.m4ident(), cx - w, cy - h, z, 0, 0, 1, uL, 1);
    var i10 = lab.vert(V.m4ident(), V.m4ident(), cx + w, cy - h, z, 0, 0, 1, uR, 1);
    var i11 = lab.vert(V.m4ident(), V.m4ident(), cx + w, cy + h, z, 0, 0, 1, uR, 0);
    var i01 = lab.vert(V.m4ident(), V.m4ident(), cx - w, cy + h, z, 0, 0, 1, uL, 0);
    lab.i.push(i00, i10, i11, i00, i11, i01);
  }
  labelQuad(1.17, false);
  labelQuad(-1.17, true);
  var labMat = { color: [1,1,1], spec: [0.1,0.1,0.1], shin: 20, emis: [0,0,0], alpha: 1, tex: app.texLabel, cut: 0.45 };
  machine.add(gl, gy, M_YELLOW);
  machine.add(gl, gd, M_CHAR);
  machine.addGlass(gl, gg, M_GLASS);
  machine.addDecal(gl, lab, labMat);
})();

/* 前车架 */
(function () {
  var gy = new V.Geo(), gd = new V.Geo();
  gd.rbox(T(0.4, 0.78, 0), 1.15, 0.30, 1.02, 0.08, 3);
  gy.rbox(T(0.9, 1.35, 0), 0.72, 0.28, 1.05, 0.10, 4);
  gd.cyl(m4chain(T(1.7, 0.85, 0), RX(PI/2)), 0.16, 0.16, 2.0, 10, true);
  gd.box(T(1.30, 1.55, 1.02), 0.14, 0.22, 0.06);
  gd.box(T(1.30, 1.55, -1.02), 0.14, 0.22, 0.06);
  /* 举升缸下支座（后车架侧） */
  gd.box(T(-0.5, 1.30, 0.80), 0.08, 0.09, 0.05);
  gd.box(T(-0.5, 1.30, -0.80), 0.08, 0.09, 0.05);
  frontFrame.add(gl, gy, M_YELLOW);
  frontFrame.add(gl, gd, M_CHAR);
})();

/* 举升臂（左右各一，局部 +X 前伸，铰点为原点） */
function buildArm() {
  var gy = new V.Geo(), gd = new V.Geo();
  gy.rbox(T(1.55, 0, 0), 1.58, 0.26, 0.20, 0.05, 3);
  gd.cyl(m4chain(T(0, 0, 0), RX(PI/2)), 0.09, 0.09, 0.26, 10, true);
  gd.box(T(1.6, 0.35, 0), 0.10, 0.10, 0.06); /* 翻斗缸上支座 */
  return { gy: gy, gd: gd };
}
(function () {
  var a = buildArm();
  liftL.add(gl, a.gy, M_YELLOW);
  liftL.add(gl, a.gd, M_CHAR);
  var b = buildArm();
  liftR.add(gl, b.gy, M_YELLOW);
  liftR.add(gl, b.gd, M_CHAR);
})();

/* 铲斗（局部：铰点为原点，+X 为斗口方向，rot=0 时斗口沿臂向） */
function buildBucket() {
  var gy = new V.Geo(), gd = new V.Geo();
  var W = 1.32;
  gy.box(m4chain(T(1.05, 0.28, 0), RZ(rad(14))), 0.55, 0.05, W);
  gy.box(m4chain(T(0.48, 0.78, 0), RZ(rad(28))), 0.60, 0.05, W);
  [1, -1].forEach(function (sg) {
    gy.box(m4chain(T(0.76, 0.53, sg * W), RZ(rad(21))), 0.62, 0.42, 0.04);
  });
  gy.box(m4chain(T(1.60, 0.20, 0), RZ(rad(14))), 0.06, 0.14, W);
  for (var i = 0; i < 5; i++) {
    gd.box(m4chain(T(1.68, 0.16, (i - 2) * 0.52), RZ(rad(14))), 0.10, 0.10, 0.07);
  }
  gd.cyl(m4chain(T(0, 0, W + 0.12), RX(PI/2)), 0.075, 0.075, 0.12, 8, true);
  gd.cyl(m4chain(T(0, 0, -W - 0.12), RX(PI/2)), 0.075, 0.075, 0.12, 8, true);
  gd.box(T(-0.15, 0.45, 0), 0.10, 0.20, 0.40); /* 翻斗缸铰耳 */
  return { gy: gy, gd: gd };
}
(function () {
  var a = buildBucket();
  bktL.add(gl, a.gy, M_YELLOW);
  bktL.add(gl, a.gd, M_CHAR);
  var b = buildBucket();
  bktR.add(gl, b.gy, M_YELLOW);
  bktR.add(gl, b.gd, M_CHAR);
})();

/* ---------------- 轮胎 ---------------- */
var meshWheel, meshHub;
(function () {
  var gr = new V.Geo();
  gr.cyl(RX(PI/2), 0.85, 0.85, 0.55, 18, true);
  for (var i = 0; i < 14; i++) {
    var a = i / 14 * 2 * PI;
    gr.box(m4chain(T(Math.cos(a) * 0.80, Math.sin(a) * 0.80, 0), RZ(a)), 0.16, 0.07, 0.56);
  }
  meshWheel = app.makeMesh(gr);
  var gh = new V.Geo();
  gh.cyl(RX(PI/2), 0.42, 0.42, 0.57, 12, true);
  meshHub = app.makeMesh(gh);
})();

/* ---------------- 演示 ---------------- */
function stopDemo() { demo.on = false; app.setDemo(false); }
function startDemo() {
  demo.steps = [
    { drive: 4.2, dur: 4.0 },
    { j: { lift: rad(2), rot: rad(-78) }, mt: 5 },
    { drive: 2.4, dur: 3.4, dig: true },
    { j: { rot: rad(-15) }, mt: 2.8, dig: true },
    { j: { lift: rad(45), rot: rad(45) }, mt: 4 },
    { drive: -4.8, dur: 4.4 },
    { j: { rot: rad(-128) }, mt: 2.8, dump: true },
    { j: { rot: rad(55), lift: rad(15) }, mt: 3.5 },
    { drive: 4.8, dur: 4.4 },
    { j: { lift: PARK.lift, rot: PARK.rot }, mt: 3 }
  ];
  demo.on = true; demo.i = 0; demo.t = 0; demo.done = 0;
  app.setDemo(true);
}
function resetAll() {
  stopDemo();
  sim.x = SPAWN.x; sim.z = SPAWN.z; sim.h = SPAWN.h;
  sim.v = 0; sim.art = 0; sim.artT = 0; sim.tv = 0;
  sim.J.lift = PARK.lift; sim.J.rot = PARK.rot;
  for (var k in sim.JV) sim.JV[k] = 0;
  app.camReset();
}
function demoStepAdvance() {
  demo.i++;
  if (demo.i >= demo.steps.length) demo.i = demo.loopFrom;
  demo.t = 0; demo.done = 0;
}
function updateDemo(dt) {
  if (!demo.on) return;
  var st = demo.steps[demo.i];
  if (!st) { stopDemo(); return; }
  demo.t += dt;
  if (st.drive !== undefined) {
    demo.done += sim.v * dt;
    var rem = st.drive - demo.done;
    var tmax = Math.max(0.4, st.dur - demo.t);
    sim.tv = clamp(rem / tmax * 1.3, -VMAX, VMAX);
    sim.artT = 0;
    if (Math.abs(rem) < 0.15 || demo.t > st.dur + 1.5) demoStepAdvance();
  } else if (st.j) {
    sim.tv = 0; sim.artT = 0;
    var all = true;
    for (var k in st.j) {
      var d = st.j[k] - sim.J[k];
      if (Math.abs(d) > 0.02) all = false;
      var v = clamp(d / Math.max(dt, 1e-4), -RATE[k], RATE[k]);
      sim.JV[k] = lerp(sim.JV[k], v * Math.min(1, Math.abs(d) / 0.12 + 0.12), Math.min(1, dt * 14));
    }
    if (st.dig || st.dump) digDumpFx(dt, st);
    if (all || demo.t > st.mt) demoStepAdvance();
  }
}
var digTimer = 0, dumpTimer = 0;
var EDGE = [0,0,0];
function bucketEdgeWorld(out) {
  return pt(bktL.world, 1.68, 0.10, 0, out || [0,0,0]);
}
function digDumpFx(dt, st) {
  bucketEdgeWorld(EDGE);
  var mh = app.moundH(EDGE[0], EDGE[2]);
  if (st.dig) {
    if (sim.JV.rot > 0.02 && EDGE[0] > 0 && EDGE[1] < mh + 0.8 && EDGE[1] > mh - 1.6) {
      for (var i = 0; i < 3; i++) {
        var a = Math.random() * 2 * PI;
        app.spawnP(EDGE[0] + (Math.random()-0.5)*0.5, EDGE[1] + Math.random()*0.3, EDGE[2] + (Math.random()-0.5)*0.5,
          Math.cos(a) * (0.6 + Math.random()), 1.0 + Math.random() * 2.0, Math.sin(a) * (0.6 + Math.random()),
          0.12 + Math.random() * 0.2, 0.5 + Math.random() * 0.5, 0.27, 0.22, 0.16, 0.85, 5.5);
      }
      digTimer -= dt;
      if (digTimer <= 0) { digTimer = 0.12; app.stampBlob(EDGE[0], EDGE[2], 0.6, 0.22); }
    }
  }
  if (st.dump && sim.J.rot < rad(-60)) {
    dumpTimer -= dt;
    if (dumpTimer <= 0) {
      dumpTimer = 0.05;
      for (var j = 0; j < 3; j++) {
        app.spawnP(EDGE[0] + (Math.random()-0.5)*0.9, EDGE[1] + 0.3, EDGE[2] + (Math.random()-0.5)*0.9,
          (Math.random()-0.5)*0.8, -0.3, (Math.random()-0.5)*0.8,
          0.14 + Math.random() * 0.18, 0.6 + Math.random() * 0.4, 0.28, 0.23, 0.17, 0.85, 6);
      }
      app.stampBlob(EDGE[0], EDGE[2], 0.7, 0.18);
    }
  }
}

/* ---------------- 每帧更新 ---------------- */
var exTimer = 0, dustTimer = 0, stampAcc = 0;
var _wpA = [0,0,0], _wpB = [0,0,0], _wpC = [0,0,0], _wpD = [0,0,0];
function update(dt, t) {
  /* 驾驶 */
  if (!demo.on) {
    sim.tv = ((key.f ? 1 : 0) - (key.b ? 1 : 0)) * VMAX;
    var steer = (key.l ? 1 : 0) - (key.r ? 1 : 0); /* 左转=负 → h 减 */
    sim.artT = clamp(-steer * ART_MAX, -ART_MAX, ART_MAX);
  }
  var artRate = Math.abs(sim.artT) > Math.abs(sim.art) ? 0.9 : 1.4;
  sim.art += clamp(sim.artT - sim.art, -artRate * dt, artRate * dt);
  var w = sim.v / L_WB * Math.tan(sim.art);
  sim.v += clamp(sim.tv - sim.v, -3.2 * dt, 3.2 * dt);
  sim.x += Math.cos(sim.h) * sim.v * dt;
  sim.z += -Math.sin(sim.h) * sim.v * dt;
  sim.h += w * dt;
  sim.dist += sim.v * dt;
  sim.x = clamp(sim.x, -120, 120);
  sim.z = clamp(sim.z, -120, 120);

  /* 工作装置 */
  if (!demo.on) {
    var dirs = {
      lift: (key.bu ? 1 : 0) - (key.bd ? 1 : 0),
      rot: (key.bc ? 1 : 0) - (key.bo ? 1 : 0)
    };
    for (var j in dirs) {
      sim.JV[j] = lerp(sim.JV[j], dirs[j] * RATE[j], Math.min(1, dt * 12));
    }
  }
  for (j in sim.J) sim.J[j] += sim.JV[j] * dt;
  for (j in LIMIT) {
    if (sim.J[j] < LIMIT[j][0]) { sim.J[j] = LIMIT[j][0]; if (sim.JV[j] < 0) sim.JV[j] = 0; }
    if (sim.J[j] > LIMIT[j][1]) { sim.J[j] = LIMIT[j][1]; if (sim.JV[j] > 0) sim.JV[j] = 0; }
  }

  updateDemo(dt);

  /* 节点姿态 */
  m4mul(T(sim.x, 0, sim.z), RY(sim.h), machine.local);
  machine.world = machine.local;
  frontFrame.local = RY(sim.art);
  liftL.local = m4mul(T(1.30, 1.55, 1.02), RZ(sim.J.lift));
  liftR.local = m4mul(T(1.30, 1.55, -1.02), RZ(sim.J.lift));
  bktL.local = m4mul(T(3.15, 0.06, 0), RZ(sim.J.rot));
  bktR.local = m4mul(T(3.15, 0.06, 0), RZ(sim.J.rot));
  frontFrame.update(machine.world);

  app.setBlob(true, sim.x, sim.z, sim.h, 3.6, 2.4);
  app.updateParts(dt);
  app.uploadDecal(t);

  /* 车辙与尘土 */
  if (Math.abs(sim.v) > 0.4) {
    stampAcc += Math.abs(sim.v) * dt;
    if (stampAcc > 0.22) {
      stampAcc = 0;
      var sxo = Math.sin(sim.h), czo = Math.cos(sim.h);
      var fpx = sim.x + Math.cos(sim.h) * 1.7;
      var fpz = sim.z - Math.sin(sim.h) * 1.7;
      var bpx = sim.x - Math.cos(sim.h) * 1.6;
      var bpz = sim.z + Math.sin(sim.h) * 1.6;
      app.stampRect(fpx + sxo * 1.15, fpz + czo * 1.15, sim.h, 0.62, 0.42, 0.05);
      app.stampRect(fpx - sxo * 1.15, fpz - czo * 1.15, sim.h, 0.62, 0.42, 0.05);
      app.stampRect(bpx + sxo * 1.15, bpz + czo * 1.15, sim.h, 0.62, 0.42, 0.05);
      app.stampRect(bpx - sxo * 1.15, bpz - czo * 1.15, sim.h, 0.62, 0.42, 0.05);
    }
    if (!app.reduced) {
      dustTimer -= dt;
      if (dustTimer <= 0) {
        dustTimer = 0.07;
        var bx = sim.x - Math.cos(sim.h) * 2.6;
        var bz = sim.z + Math.sin(sim.h) * 2.6;
        for (var s = 0; s < 2; s++) {
          var ox = Math.sin(sim.h) * (s ? 1.15 : -1.15);
          var oz = Math.cos(sim.h) * (s ? 1.15 : -1.15);
          app.spawnP(bx + ox + (Math.random()-0.5)*0.5, 0.25, bz + oz + (Math.random()-0.5)*0.5,
            -Math.cos(sim.h) * 1.0 + (Math.random()-0.5), 0.4 + Math.random() * 0.6, Math.sin(sim.h) * 1.0 + (Math.random()-0.5),
            0.45 + Math.random() * 0.55, 0.7 + Math.random() * 0.4, 0.42, 0.37, 0.29, 0.22, 0.4);
        }
      }
    }
  }
  /* 尾气 */
  if (!app.reduced) {
    exTimer -= dt;
    if (exTimer <= 0) {
      exTimer = 0.15;
      var sp = pt(machine.world, -1.1, 2.52, -0.55, [0,0,0]);
      app.spawnP(sp[0], sp[1], sp[2],
        (Math.random()-0.5) * 0.2, 0.9 + Math.random() * 0.4, (Math.random()-0.5) * 0.2,
        0.20 + Math.random() * 0.1, 1.3 + Math.random() * 0.4, 0.32, 0.32, 0.33, 0.16, -0.12);
    }
  }
}

/* ---------------- 动态绘制（轮子 + 液压缸） ---------------- */
function drawWheel(prog, mm, depth) {
  if (depth) {
    V.bindMesh(prog, meshWheel);
    app.gl.uniformMatrix4fv(prog.u.uModel, false, mm);
    app.gl.drawElements(app.gl.TRIANGLES, meshWheel.n, app.gl.UNSIGNED_SHORT, 0);
    V.bindMesh(prog, meshHub);
    app.gl.uniformMatrix4fv(prog.u.uModel, false, mm);
    app.gl.drawElements(app.gl.TRIANGLES, meshHub.n, app.gl.UNSIGNED_SHORT, 0);
  } else {
    app.drawMat(prog, meshWheel, M_RUBBER, mm);
    app.drawMat(prog, meshHub, M_STEEL_D, mm);
  }
}
function dynDraw(prog, depth, isBeltProg) {
  if (isBeltProg) return;
  var d1 = drawOneFactory(prog, depth);
  var roll = -sim.dist / 0.85;
  drawWheel(prog, m4chain(frontFrame.world, T(1.7, 0.85, 1.15), RZ(roll)), depth);
  drawWheel(prog, m4chain(frontFrame.world, T(1.7, 0.85, -1.15), RZ(roll)), depth);
  drawWheel(prog, m4chain(machine.world, T(-1.6, 0.85, 1.15), RZ(roll)), depth);
  drawWheel(prog, m4chain(machine.world, T(-1.6, 0.85, -1.15), RZ(roll)), depth);
  [1, -1].forEach(function (sg) {
    var arm = sg > 0 ? liftL : liftR;
    var bkt = sg > 0 ? bktL : bktR;
    pt(machine.world, -0.5, 1.30, sg * 0.80, _wpA);
    pt(arm.world, 1.05, 0.28, 0, _wpB);
    drawCyl(d1, _wpA, _wpB, 0.10, 0.06);
    pt(arm.world, 1.6, 0.35, sg * 0.5, _wpC);
    pt(bkt.world, -0.15, 0.45, 0, _wpD);
    drawCyl(d1, _wpC, _wpD, 0.085, 0.052);
  });
}

app.setScene(machine, dynDraw);
app.start();
window.__ld = { sim: sim, machine: machine, frontFrame: frontFrame, liftL: liftL, bktL: bktL };

})();
</script>
