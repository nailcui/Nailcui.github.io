<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f0">
<title>造型库 · 磁力片搭建</title>
<link rel="stylesheet" href="tiles.css">
<style>
  .head { padding: 26px 0 6px; }
  .head h1 { margin: 0; font-size: 28px; letter-spacing: .01em; }
  .head p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; }
  .head p a { color: var(--pri-d); }
  .filters { display: grid; gap: 12px; margin: 18px 0 8px; }
  .search {
    position: relative; max-width: 460px;
  }
  .search input {
    width: 100%; height: 46px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card);
    padding: 0 18px 0 44px; font: inherit; font-size: 16px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }
  .search svg { position: absolute; left: 16px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row-label { font-size: 13px; color: var(--ink-3); width: 44px; flex: none; }
  .chip .n { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chip.on .n { color: rgba(255, 255, 255, .7); }
  .chip svg { width: 15px; height: 15px; }
  .chip.fav-chip.on { background: var(--coral); border-color: var(--coral); }
  .chip.fav-chip.on svg path { fill: currentColor; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 14px; font-size: 14px; color: var(--ink-2); }
  .bar button { border: 0; background: none; color: var(--pri-d); cursor: pointer; font-size: 14px; padding: 6px 2px; }
  .empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 16px; }
  .empty p { margin: 0 0 14px; font-size: 14px; }
  @media (max-width: 640px) {
    .head { padding-top: 18px; }
    .head h1 { font-size: 24px; }
    .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
    .row::-webkit-scrollbar { display: none; }
    .row-label { width: auto; }
    .chip { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
    .filters { gap: 10px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="11" width="13" height="13" rx="2.5" fill="#ee6a55" fill-opacity=".3" stroke="#ee6a55" stroke-width="2"/><rect x="10" y="4" width="13" height="13" rx="2.5" fill="#f2ac2a" fill-opacity=".3" stroke="#f2ac2a" stroke-width="2"/><rect x="16" y="14" width="13" height="13" rx="2.5" fill="#0e9f8e" fill-opacity=".26" stroke="#0e9f8e" stroke-width="2"/></svg>
      <span><b>磁力片搭建</b><small>亲子 3D 搭建指南</small></span>
    </a>
    <nav class="nav">
      <a class="on" href="library.html" aria-current="page">造型库</a>
      <a href="mytiles.html">我的磁片</a>
      <a class="home" href="../" title="回到博客主页">←<span> 主页</span></a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>造型库</h1>
    <p id="sub"></p>
  </div>
  <div class="filters">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="搜索造型，如「小鸭」「城堡」" autocomplete="off" aria-label="搜索造型">
    </label>
    <div class="row" id="themes" role="group" aria-label="主题"></div>
    <div class="row" id="levels" role="group" aria-label="难度"></div>
    <div class="row" id="sizes" role="group" aria-label="片数"></div>
  </div>
  <div class="bar"><span id="count"></span><button type="button" id="reset" hidden>清除筛选</button></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>
<footer class="foot">
  所有造型都由正方形、等边三角形、直角三角形三种基础片搭成 · 结构为示意教学，未做承重仿真<br>
  <a href="./">磁力片搭建首页</a> · <a href="../">博客主页</a>
</footer>

<script src="three.min.js"></script>
<script src="tiles-core.js"></script>
<script src="tiles-models.js"></script>
<script src="tiles3d.js"></script>
<script src="tiles-ui.js"></script>
<script>
(function () {
  'use strict';
  var C = TilesCore, M = TilesModels, UI = TilesUI, $ = function (id) { return document.getElementById(id); };
  var all = M.list;
  var SIZES = [
    { id: 's', name: '20 片以内', test: function (n) { return n <= 20; } },
    { id: 'm', name: '21–30 片', test: function (n) { return n > 20 && n <= 30; } },
    { id: 'l', name: '31 片以上', test: function (n) { return n > 30; } }
  ];
  var qs = new URLSearchParams(location.search);
  var f = { q: qs.get('q') || '', theme: qs.get('theme') || '', level: +qs.get('level') || 0, size: qs.get('size') || '', fav: qs.get('fav') === '1', can: false };
  var inv = UI.getInv();

  $('sub').innerHTML = '共 ' + all.length + ' 款可旋转的 3D 造型，每款都有逐片的搭建步骤。' +
    (inv ? '' : '填写<a href="mytiles.html">我的磁片</a>后，可以只看材料够用的造型。');

  function chips() {
    $('themes').innerHTML = '<span class="row-label">主题</span>' +
      '<button type="button" class="chip' + (!f.theme ? ' on' : '') + '" data-theme="">全部</button>' +
      C.THEME_ORDER.map(function (t) {
        var n = all.filter(function (m) { return m.theme === t; }).length;
        return '<button type="button" class="chip' + (f.theme === t ? ' on' : '') + '" data-theme="' + t + '">' +
          C.THEMES[t].icon + ' ' + C.THEMES[t].name + ' <span class="n">' + (n || '筹备中') + '</span></button>';
      }).join('');
    $('levels').innerHTML = '<span class="row-label">难度</span>' +
      '<button type="button" class="chip' + (!f.level ? ' on' : '') + '" data-level="0">全部</button>' +
      [1, 2, 3].map(function (l) {
        return '<button type="button" class="chip' + (f.level === l ? ' on' : '') + '" data-level="' + l + '">' + C.LEVELS[l] + '</button>';
      }).join('');
    $('sizes').innerHTML = '<span class="row-label">片数</span>' +
      '<button type="button" class="chip' + (!f.size ? ' on' : '') + '" data-size="">不限</button>' +
      SIZES.map(function (s) {
        return '<button type="button" class="chip' + (f.size === s.id ? ' on' : '') + '" data-size="' + s.id + '">' + s.name + '</button>';
      }).join('') +
      '<button type="button" class="chip fav-chip' + (f.fav ? ' on' : '') + '" data-favonly="1" aria-pressed="' + f.fav + '">' + UI.HEART + '只看收藏</button>' +
      (inv ? '<button type="button" class="chip' + (f.can ? ' on' : '') + '" data-can="1" aria-pressed="' + f.can + '">材料够用</button>' : '');
  }

  function match(m) {
    var q = f.q.trim().toLowerCase();
    if (q && (m.name + m.intro + C.THEMES[m.theme].name).toLowerCase().indexOf(q) < 0) return false;
    if (f.theme && m.theme !== f.theme) return false;
    if (f.level && m.level !== f.level) return false;
    if (f.size && !SIZES.filter(function (s) { return s.id === f.size; })[0].test(m.pieces.length)) return false;
    if (f.fav && !C.isFav(m.id)) return false;
    if (f.can && !UI.check(m, inv).ok) return false;
    return true;
  }

  function render() {
    chips();
    var list = all.filter(match);
    var filtered = f.q || f.theme || f.level || f.size || f.fav || f.can;
    $('count').textContent = filtered ? '找到 ' + list.length + ' 款' : '全部 ' + list.length + ' 款';
    $('reset').hidden = !filtered;
    $('grid').innerHTML = list.map(UI.card).join('');
    $('grid').hidden = !list.length;
    var em = $('empty');
    em.hidden = !!list.length;
    if (!list.length) {
      var soon = f.theme && !all.some(function (m) { return m.theme === f.theme; });
      em.innerHTML = soon
        ? '<h3>' + C.THEMES[f.theme].name + '主题正在设计中</h3><p>每个造型都要先验证能实际搭起来，再放进造型库。先看看已有的作品吧。</p>'
        : '<h3>没有找到符合条件的造型</h3><p>换个关键词，或者放宽难度、片数筛选试试。</p>';
      em.innerHTML += '<button type="button" class="btn btn-ghost" id="reset2">清除筛选</button>';
      $('reset2').onclick = reset;
    }
    UI.loadThumbs($('grid'));
    // 同步地址栏，方便分享与返回
    var p = new URLSearchParams();
    if (f.q) p.set('q', f.q);
    if (f.theme) p.set('theme', f.theme);
    if (f.level) p.set('level', f.level);
    if (f.size) p.set('size', f.size);
    if (f.fav) p.set('fav', '1');
    history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
  }
  function reset() { f = { q: '', theme: '', level: 0, size: '', fav: false, can: false }; $('q').value = ''; render(); }

  $('q').value = f.q;
  var qt = 0;
  $('q').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(qt);
    qt = setTimeout(function () { f.q = v; render(); }, 160);
  });
  document.querySelector('.filters').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if ('theme' in b.dataset) f.theme = b.dataset.theme;
    else if ('level' in b.dataset) f.level = +b.dataset.level;
    else if ('size' in b.dataset) f.size = b.dataset.size;
    else if (b.dataset.favonly) f.fav = !f.fav;
    else if (b.dataset.can) f.can = !f.can;
    else return;
    render();
  });
  $('reset').onclick = reset;
  UI.bindFavs($('grid'), function () { if (f.fav) render(); });
  // 从详情页返回（往返缓存）时刷新收藏与进度
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
  render();
})();
</script>
</body>
</html>
