<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="白板 —— 极简纯文本速记，VS Code 式查找替换，内容自动保存在本机浏览器。">
  <title>白板 · Nailcui 工具箱</title>
  <link rel="stylesheet" href="./tools.css">
  <style>
    /* ---------- 整页钉在视口内：顶栏 + 编辑区 + 状态条 ---------- */
    .page.scratch {
      height: 100dvh;
      overflow: hidden;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    }
    .page.scratch .credit { margin-top: 8px; }
    .page.scratch.kb .credit { display: none; }

    .scratch-pane { position: relative; flex: 1; min-height: 200px; }
    .scratch-pane:focus-within { border-color: var(--line); }

    /* ---------- 编辑区：高亮层在下、textarea 在上，两层逐字对齐 ---------- */
    #hl, #txt {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      padding: 14px 18px;
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 1.8;
      letter-spacing: normal;
      white-space: pre-wrap;
      word-break: break-all;
      tab-size: 2;
      -moz-tab-size: 2;
    }
    .page.nowrap #hl, .page.nowrap #txt { white-space: pre; word-break: normal; }
    #hl { overflow: hidden; pointer-events: none; color: var(--ink); }
    #txt {
      background: transparent;
      color: var(--ink);
      caret-color: var(--acc);
      outline: none;
      resize: none;
      overflow: auto;
      z-index: 1;
    }
    #txt::placeholder { color: var(--ink-faint); }
    #txt::selection { background: rgba(12, 127, 110, 0.22); }

    /* 查找匹配高亮（画在高亮层，位于文字之下） */
    .m { border-radius: 3px; background: rgba(247, 181, 56, 0.35); box-shadow: 0 0 0 1px rgba(191, 133, 27, 0.25); }
    .m.cur { background: rgba(247, 181, 56, 0.6); box-shadow: 0 0 0 1.5px rgba(191, 133, 27, 0.7); }

    /* ---------- 查找替换浮层（VS Code 风格，右上角） ---------- */
    .findbar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      width: 356px;
      max-width: calc(100% - 20px);
      display: flex;
      gap: 4px;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--hair);
      background: var(--panel);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.12);
      animation: fbin 0.16s ease-out;
    }
    .findbar[hidden] { display: none; }
    @keyframes fbin { from { opacity: 0; transform: translateY(-6px); } }

    .chev {
      flex: none;
      width: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-faint);
      font-size: 11px;
      cursor: pointer;
      transition: transform 0.18s;
    }
    .chev:hover { color: var(--ink); background: var(--panel-2); }
    .chev.open { transform: rotate(90deg); }

    .f-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .f-row { display: flex; align-items: center; gap: 5px; }
    .f-row[hidden] { display: none; }

    .f-input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      height: 30px;
      padding: 0 3px 0 9px;
      border-radius: 8px;
      border: 1px solid var(--hair);
      background: var(--bg);
      transition: border-color 0.2s;
    }
    .f-input-wrap:focus-within { border-color: var(--line); }
    .f-input-wrap.err { border-color: rgba(199, 67, 60, 0.6); }
    .f-input-wrap input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      caret-color: var(--acc);
      font-family: var(--mono);
      font-size: 13px;
    }
    .f-input-wrap input::placeholder { color: var(--ink-faint); font-family: inherit; }

    .f-opts { display: flex; gap: 2px; margin-left: 3px; }
    .f-opt {
      flex: none;
      width: 25px;
      height: 22px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: 0.15s;
    }
    .f-opt:hover { color: var(--ink); background: var(--panel-2); }
    .f-opt.on { color: var(--acc2); background: rgba(12, 127, 110, 0.1); }

    .f-count {
      flex: none;
      min-width: 42px;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-dim);
      white-space: nowrap;
    }
    .f-count.bad { color: #cf222e; }

    .f-btn {
      flex: none;
      min-width: 26px;
      height: 26px;
      padding: 0 4px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    .f-btn:hover { color: var(--ink); border-color: #cfcfcf; }
    .f-btn.wide { font-family: inherit; font-size: 12px; padding: 0 9px; }

    /* ---------- 状态条 ---------- */
    .status {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 34px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--hair);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-dim);
    }
    .status .grow { flex: 1; }
    .st-btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 999px;
      height: 22px;
      padding: 0 10px;
      background: transparent;
      color: var(--ink-faint);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: 0.2s;
    }
    .st-btn:hover { color: var(--ink-dim); border-color: #cfcfcf; }
    .st-btn.on { color: var(--acc2); border-color: var(--line); background: rgba(12, 127, 110, 0.08); }
    #saved { color: var(--acc2); opacity: 0; transition: opacity 0.3s; }
    #saved.show { opacity: 1; }

    .btn.ok { border-color: var(--line); color: var(--acc2); background: rgba(12, 127, 110, 0.08); }
    .btn.danger { border-color: rgba(199, 67, 60, 0.65); color: var(--danger); }

    /* ---------- 移动端 ---------- */
    @media (max-width: 640px) {
      /* 16px 防止 iOS 聚焦时自动放大 */
      #hl, #txt { font-size: 16px; padding: 12px 14px; }
      .findbar { left: 10px; width: auto; }
      .f-input-wrap input { font-size: 16px; }
      .f-input-wrap { height: 32px; }
      .f-opt { width: 27px; }
      .f-count { min-width: 38px; }
      .status { gap: 9px; }
    }
  </style>
</head>
<body>
  <div class="page scratch" id="page">
    <header class="top">
      <a class="back" href="./">‹ 工具箱</a>
      <div class="brand">
        <h1>白板</h1>
        <p>纯文本速记 · 查找替换 · 本机自动保存</p>
      </div>
      <div class="actions">
        <button class="btn" id="btnCopy">复制</button>
        <button class="btn" id="btnClear">清空</button>
      </div>
    </header>

    <section class="pane scratch-pane" id="pane">
      <div id="hl" aria-hidden="true"></div>
      <textarea id="txt" wrap="soft" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"
        placeholder="随手记点什么…内容自动保存在本机浏览器，不会上传。&#10;&#10;⌘F / Ctrl+F 查找 · ⌘H / Ctrl+H 查找替换 · Esc 关闭"></textarea>

      <div class="findbar" id="findbar" hidden>
        <button type="button" class="chev" id="chev" title="展开 / 收起替换">▸</button>
        <div class="f-col">
          <div class="f-row">
            <div class="f-input-wrap" id="fqWrap">
              <input id="fq" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="查找" aria-label="查找内容">
              <div class="f-opts">
                <button type="button" class="f-opt" id="optCase" title="区分大小写（Alt+C）" aria-label="区分大小写">Aa</button>
                <button type="button" class="f-opt" id="optWord" title="全字匹配（Alt+W）" aria-label="全字匹配">ab</button>
                <button type="button" class="f-opt" id="optRe" title="使用正则表达式（Alt+R）" aria-label="使用正则表达式">.*</button>
              </div>
            </div>
            <span class="f-count" id="fcount"></span>
            <button type="button" class="f-btn" id="fprev" title="上一个（Shift+Enter）" aria-label="上一个匹配">↑</button>
            <button type="button" class="f-btn" id="fnext" title="下一个（Enter）" aria-label="下一个匹配">↓</button>
            <button type="button" class="f-btn" id="fclose" title="关闭（Esc）" aria-label="关闭查找">✕</button>
          </div>
          <div class="f-row" id="rrow" hidden>
            <div class="f-input-wrap">
              <input id="fr" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="替换为（正则模式支持 $1）" aria-label="替换为">
            </div>
            <button type="button" class="f-btn wide" id="rone" title="替换当前（Enter）">替换</button>
            <button type="button" class="f-btn wide" id="rall" title="替换全部">全部</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="status">
      <span id="pos">行 1 · 列 1</span>
      <span id="sel" hidden></span>
      <span class="grow"></span>
      <button type="button" class="st-btn on" id="wrapBtn" title="自动换行（Alt+Z）">自动换行</button>
      <span id="stats">1 行 · 0 字符</span>
      <span id="saved">已保存</span>
    </footer>

    <footer class="credit">纯文本 · 内容仅保存在本机浏览器 · 不上传任何数据</footer>
  </div>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  var page = $('page'), hl = $('hl'), txt = $('txt');
  var findbar = $('findbar'), chev = $('chev'), fq = $('fq'), fr = $('fr');
  var fqWrap = $('fqWrap'), fcount = $('fcount');
  var optCase = $('optCase'), optWord = $('optWord'), optRe = $('optRe');
  var fprev = $('fprev'), fnext = $('fnext'), fclose = $('fclose');
  var rrow = $('rrow'), rone = $('rone'), rall = $('rall');
  var posEl = $('pos'), selEl = $('sel'), statsEl = $('stats'), savedEl = $('saved'), wrapBtn = $('wrapBtn');
  var btnCopy = $('btnCopy'), btnClear = $('btnClear');

  var STORE_KEY = 'tools:scratch:text';
  var WRAP_KEY = 'tools:scratch:wrap';
  var COUNT_CAP = 100000;   // 最多统计的匹配数（全部替换不受此限）
  var RENDER_CAP = 3000;    // 最多内联高亮的匹配数

  var st = {
    open: false, showReplace: false,
    matchCase: false, wholeWord: false, useRegex: false,
    matches: [], cur: -1, err: false, truncated: false, zeroWidth: 0,
    marks: [], wrap: true
  };
  var refreshT = 0, saveT = 0, savedT = 0, countT = 0, armT = 0;
  var lastField = fq;

  /* ---------- 启动：恢复本机保存的内容 ---------- */
  try { txt.value = localStorage.getItem(STORE_KEY) || ''; } catch (e) { /* 隐私模式等 */ }
  try { st.wrap = localStorage.getItem(WRAP_KEY) !== '0'; } catch (e) { /* 忽略 */ }

  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function escText(s) {
    return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  }

  /* ---------- 高亮层对齐：滚动同步 + 滚动条占宽补偿（同正则页） ---------- */
  function syncGutter() {
    var gap = txt.offsetWidth - txt.clientWidth;
    var target = gap > 0 ? (18 + gap) + 'px' : '18px';
    if (hl.style.paddingRight !== target) hl.style.paddingRight = target;
  }
  function syncScroll() { hl.scrollTop = txt.scrollTop; hl.scrollLeft = txt.scrollLeft; }
  txt.addEventListener('scroll', syncScroll);
  window.addEventListener('resize', syncGutter);

  /* ---------- 匹配 ---------- */
  function buildRe() {
    var q = fq.value;
    var src = st.useRegex ? q : escRe(q);
    if (st.wholeWord) src = '\\b(?:' + src + ')\\b';
    return new RegExp(src, 'g' + (st.matchCase ? '' : 'i') + 'm');
  }
  function compute() {
    st.err = false; st.truncated = false; st.zeroWidth = 0;
    st.matches = [];
    if (!st.open) return;
    var q = fq.value, text = txt.value;
    if (!q || !text) return;
    var re;
    try { re = buildRe(); } catch (e) { st.err = true; return; }
    var guard = 0, zw = 0;
    while (guard++ <= COUNT_CAP) {
      var m = re.exec(text);
      if (!m) break;
      if (m[0].length === 0) {
        zw++;
        re.lastIndex++;
        if (re.lastIndex > text.length) break;
        continue;
      }
      st.matches.push({ s: m.index, e: m.index + m[0].length, str: m[0] });
      if (st.matches.length >= COUNT_CAP) { st.truncated = true; break; }
    }
    st.zeroWidth = zw;
  }
  /* mode: 'caret' 按光标取当前项 | 'keep' 尽量保持当前项 */
  function pick(mode) {
    var ms = st.matches, n = ms.length;
    if (!n) { st.cur = -1; return; }
    if (mode === 'keep' && st.cur >= 0 && st.cur < n) return;
    var caret = txt.selectionEnd || 0, idx = 0, i;
    for (i = 0; i < n; i++) { if (ms[i].s >= caret) { idx = i; break; } }
    if (i >= n) idx = 0;
    st.cur = idx;
  }
  function paint() {
    if (!st.open) { if (hl.firstChild) hl.textContent = ''; return; }
    var text = txt.value, ms = st.matches;
    if (!ms.length) {
      hl.textContent = text;
      st.marks = [];
      syncGutter(); syncScroll();
      return;
    }
    var parts = [], pos = 0, n = Math.min(ms.length, RENDER_CAP);
    for (var i = 0; i < n; i++) {
      var m = ms[i];
      if (m.s > pos) parts.push(escText(text.slice(pos, m.s)));
      parts.push('<span class="m' + (i === st.cur ? ' cur' : '') + '">' + escText(m.str) + '</span>');
      pos = m.e;
    }
    if (pos < text.length) parts.push(escText(text.slice(pos)));
    hl.innerHTML = parts.join('');
    st.marks = hl.querySelectorAll('.m');
    syncGutter(); syncScroll();
  }
  function updateCount() {
    fcount.classList.remove('bad');
    fqWrap.classList.remove('err');
    if (!st.open) { fcount.textContent = ''; return; }
    if (st.err) {
      fcount.textContent = '正则无效'; fcount.classList.add('bad');
      fqWrap.classList.add('err');
      return;
    }
    if (!fq.value) { fcount.textContent = ''; return; }
    var n = st.matches.length;
    if (!n) {
      if (st.zeroWidth) fcount.textContent = '仅零宽匹配';
      else { fcount.textContent = '无结果'; fcount.classList.add('bad'); }
      return;
    }
    fcount.textContent = (st.cur + 1) + '/' + n + (st.truncated ? '+' : '');
  }

  /* ---------- 当前匹配：选中 + 滚动到可见 ---------- */
  function selectCur() {
    var m = st.matches[st.cur];
    if (!m) return;
    var prev = hl.querySelector('.m.cur');
    if (prev) prev.classList.remove('cur');
    if (st.marks[st.cur]) st.marks[st.cur].classList.add('cur');
    try { txt.setSelectionRange(m.s, m.e); } catch (e) { /* 忽略 */ }
    updateCount();
    ensureVisible(st.cur);
  }
  function ensureVisible(i) {
    var el = st.marks[i];
    if (!el) return;
    var top = el.offsetTop, bot = top + el.offsetHeight;
    var stp = txt.scrollTop, ch = txt.clientHeight;
    if (top < stp + 12 || bot > stp + ch - 12) txt.scrollTop = Math.max(0, top - ch / 3);
    if (!st.wrap) {
      var left = el.offsetLeft, right = left + el.offsetWidth;
      var sl = txt.scrollLeft, cw = txt.clientWidth;
      if (left < sl + 12 || right > sl + cw - 12) txt.scrollLeft = Math.max(0, left - cw / 3);
    }
    syncScroll();
  }
  function refresh(mode) {
    compute();
    pick(mode);
    paint();
    updateCount();
    if (mode === 'caret' && st.cur >= 0) selectCur();
  }
  function step(dir) {
    refresh('keep');
    var n = st.matches.length;
    if (!n) return;
    var base = st.cur < 0 ? (dir > 0 ? -1 : 0) : st.cur;
    st.cur = (base + dir + n) % n;
    selectCur();
  }

  /* ---------- 打开 / 关闭 ---------- */
  function setReplace(v) {
    st.showReplace = v;
    rrow.hidden = !v;
    chev.classList.toggle('open', v);
  }
  function openFind(withReplace) {
    findbar.hidden = false;
    st.open = true;
    if (withReplace) setReplace(true);
    var s = txt.selectionStart, e = txt.selectionEnd;
    if (e > s) {
      var sel = txt.value.slice(s, e);
      if (sel.indexOf('\n') < 0 && sel.length <= 200) fq.value = sel;
    }
    refresh('caret');
    fq.focus();
    fq.select();
  }
  function closeFind() {
    st.open = false;
    findbar.hidden = true;
    st.matches = []; st.cur = -1; st.marks = [];
    hl.textContent = '';
    updateCount();
    txt.focus();
  }

  /* ---------- 替换 ---------- */
  /* 正则模式下重取匹配数组，展开 $1、$&、$`、$' 等引用 */
  function matchArrAt(m) {
    var re;
    try { re = buildRe(); } catch (e) { return null; }
    re.lastIndex = m.s;
    var r = null;
    try { r = re.exec(txt.value); } catch (e2) { return null; }
    return (r && r.index === m.s) ? r : null;
  }
  function expand(m, repl) {
    if (!st.useRegex || repl.indexOf('$') < 0) return repl;
    var arr = matchArrAt(m);
    return repl.replace(/\$(\$|&|\d{1,2}|`|')/g, function (raw, g) {
      if (g === '$') return '$';
      if (g === '&') return arr ? arr[0] : m.str;
      if (g === '`') return txt.value.slice(0, m.s);
      if (g === "'") return txt.value.slice(m.e);
      var n = +g;
      return (arr && arr[n] !== undefined) ? arr[n] : '';
    });
  }
  /* execCommand 走原生输入管线，保留撤销栈；失败再退化 setRangeText */
  function replaceRange(s, e, str) {
    txt.focus();
    txt.setSelectionRange(s, e);
    var ok = false;
    try { ok = document.execCommand('insertText', false, str); } catch (err) { ok = false; }
    if (!ok) {
      if (txt.setRangeText) txt.setRangeText(str, s, e, 'end');
      else txt.value = txt.value.slice(0, s) + str + txt.value.slice(e);
      txt.selectionStart = txt.selectionEnd = s + str.length;
      onEdited();
    }
  }
  function refocusField() { lastField.focus(); }
  function replaceOne() {
    refresh('keep');
    if (st.err || !st.matches.length) return;
    if (st.cur < 0) { step(1); if (!st.matches.length) return; }
    var m = st.matches[st.cur];
    var exp = expand(m, fr.value);
    replaceRange(m.s, m.e, exp);
    txt.selectionStart = txt.selectionEnd = m.s + exp.length;
    refresh('caret');
    updateStats();
    scheduleSave();
    refocusField();
  }
  function replaceAll() {
    refresh('keep');
    if (st.err || !fq.value) return;
    if (!st.matches.length && !st.zeroWidth) return;
    var text = txt.value, repl = fr.value, q = fq.value;
    var count = st.matches.length, out;
    if (st.useRegex) {
      var re;
      try { re = buildRe(); } catch (e) { return; }
      out = text.replace(re, repl);           // 原生替换，$1 等引用语义一致
      if (st.truncated) count = COUNT_CAP + '+';
    } else {
      var parts = text.split(q);
      count = parts.length - 1;
      out = parts.join(repl);                 // 字面量替换，不做任何转义解释
    }
    if (!count && !st.zeroWidth) return;
    txt.value = out;
    var caretTo = (st.matches.length && st.matches[0].s <= out.length) ? st.matches[0].s : 0;
    txt.selectionStart = txt.selectionEnd = caretTo;
    refresh('caret');
    updateStats();
    saveNow();
    flashCount('已替换 ' + count + ' 处');
    refocusField();
  }
  function flashCount(msg) {
    fcount.classList.remove('bad');
    fcount.textContent = msg;
    clearTimeout(countT);
    countT = setTimeout(updateCount, 1800);
  }

  /* ---------- 状态条与保存 ---------- */
  function updateStats() {
    var v = txt.value;
    statsEl.textContent = v.split('\n').length + ' 行 · ' + v.length + ' 字符';
    var p = txt.selectionStart || 0;
    var before = v.slice(0, p);
    var nl = before.lastIndexOf('\n');
    posEl.textContent = '行 ' + before.split('\n').length + ' · 列 ' + (p - nl);
    var selN = (txt.selectionEnd || 0) - p;
    if (selN > 0) { selEl.hidden = false; selEl.textContent = '选中 ' + selN; }
    else selEl.hidden = true;
  }
  function saveNow() {
    try {
      localStorage.setItem(STORE_KEY, txt.value);
      savedEl.textContent = '已保存';
      savedEl.classList.add('show');
      clearTimeout(savedT);
      savedT = setTimeout(function () { savedEl.classList.remove('show'); }, 1400);
    } catch (e) {
      savedEl.textContent = '保存失败';
      savedEl.classList.add('show');
    }
  }
  function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveNow, 400); }

  /* ---------- 自动换行 ---------- */
  function applyWrap() {
    page.classList.toggle('nowrap', !st.wrap);
    txt.setAttribute('wrap', st.wrap ? 'soft' : 'off');
    wrapBtn.classList.toggle('on', st.wrap);
    syncGutter(); syncScroll();
  }
  function toggleWrap() {
    st.wrap = !st.wrap;
    try { localStorage.setItem(WRAP_KEY, st.wrap ? '1' : '0'); } catch (e) { /* 忽略 */ }
    applyWrap();
    if (st.open && st.cur >= 0) ensureVisible(st.cur);
  }

  /* ---------- 事件 ---------- */
  function onEdited() {
    updateStats();
    scheduleSave();
    clearTimeout(refreshT);
    refreshT = setTimeout(function () { if (st.open) refresh('keep'); }, 80);
  }
  txt.addEventListener('input', onEdited);
  document.addEventListener('selectionchange', function () {
    if (document.activeElement === txt) updateStats();
  });

  /* Tab 插入两个空格（编辑器惯例，Shift+Tab 保留默认行为便于键盘导航） */
  txt.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    var ok = false;
    try { ok = document.execCommand('insertText', false, '  '); } catch (err) { ok = false; }
    if (!ok) {
      var s = txt.selectionStart, se = txt.selectionEnd;
      if (txt.setRangeText) txt.setRangeText('  ', s, se, 'end');
      else txt.value = txt.value.slice(0, s) + '  ' + txt.value.slice(se);
      txt.selectionStart = txt.selectionEnd = s + 2;
      onEdited();
    }
  });

  /* 页面隐藏/关闭时立即落盘，避免防抖窗口内丢字 */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { clearTimeout(saveT); saveNow(); }
  });
  window.addEventListener('pagehide', function () { clearTimeout(saveT); saveNow(); });

  fq.addEventListener('input', function () {
    clearTimeout(refreshT);
    refreshT = setTimeout(function () { refresh('caret'); }, 120);
  });
  fq.addEventListener('focus', function () { lastField = fq; });
  fr.addEventListener('focus', function () { lastField = fr; });
  fq.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });
  fr.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); replaceOne(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });

  function bindOpt(btn, key) {
    btn.addEventListener('click', function () {
      st[key] = !st[key];
      btn.classList.toggle('on', st[key]);
      refresh('caret');
      lastField.focus();
      lastField.select();
    });
  }
  bindOpt(optCase, 'matchCase');
  bindOpt(optWord, 'wholeWord');
  bindOpt(optRe, 'useRegex');

  chev.addEventListener('click', function () {
    setReplace(!st.showReplace);
    if (st.showReplace) fr.focus(); else fq.focus();
  });
  fprev.addEventListener('click', function () { step(-1); });
  fnext.addEventListener('click', function () { step(1); });
  fclose.addEventListener('click', closeFind);
  rone.addEventListener('click', replaceOne);
  rall.addEventListener('click', replaceAll);
  wrapBtn.addEventListener('click', toggleWrap);

  /* 全局快捷键 */
  document.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey;
    var k = e.key;
    if (mod && !e.altKey && (k === 'f' || k === 'F')) { e.preventDefault(); openFind(false); return; }
    if (mod && !e.altKey && (k === 'h' || k === 'H')) { e.preventDefault(); openFind(true); return; }
    if (k === 'F3') {
      e.preventDefault();
      if (!st.open) openFind(false); else step(e.shiftKey ? -1 : 1);
      return;
    }
    if (e.altKey && !mod && (k === 'z' || k === 'Z')) { e.preventDefault(); toggleWrap(); return; }
    if (st.open && e.altKey && !mod && findbar.contains(document.activeElement)) {
      var lk = k.toLowerCase();
      if (lk === 'c') { e.preventDefault(); optCase.click(); return; }
      if (lk === 'w') { e.preventDefault(); optWord.click(); return; }
      if (lk === 'r') { e.preventDefault(); optRe.click(); return; }
    }
    if (k === 'Escape' && st.open) { e.preventDefault(); closeFind(); }
  });

  /* ---------- 顶栏按钮 ---------- */
  function flashBtn(btn, label) {
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = label;
    btn.classList.add('ok');
    clearTimeout(btn._t);
    btn._t = setTimeout(function () {
      btn.textContent = btn.dataset.label;
      btn.classList.remove('ok');
    }, 1200);
  }
  btnCopy.addEventListener('click', function () {
    var v = txt.value;
    if (!v) { flashBtn(btnCopy, '空空如也'); return; }
    var fallback = function () {
      var active = document.activeElement;
      txt.focus();
      txt.setSelectionRange(0, v.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      txt.setSelectionRange(0, 0);
      if (active && active.focus) active.focus();
      flashBtn(btnCopy, ok ? '已复制' : '复制失败');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(function () { flashBtn(btnCopy, '已复制'); }, fallback);
    } else fallback();
  });
  function disarmClear() {
    clearTimeout(armT);
    btnClear.classList.remove('danger');
    btnClear.textContent = '清空';
  }
  btnClear.addEventListener('click', function () {
    if (!txt.value) { flashBtn(btnClear, '已是空白'); return; }
    if (!btnClear.classList.contains('danger')) {
      btnClear.classList.add('danger');
      btnClear.textContent = '确认清空？';
      clearTimeout(armT);
      armT = setTimeout(disarmClear, 2600);
      return;
    }
    disarmClear();
    txt.value = '';
    refresh('keep');
    updateStats();
    saveNow();
    txt.focus();
    flashBtn(btnClear, '已清空');
  });

  /* ---------- 键盘弹出时收缩页面高度（手机上 textarea 不被输入法遮住） ---------- */
  var vv = window.visualViewport;
  function isEditing() {
    var ae = document.activeElement;
    return ae === txt || ae === fq || ae === fr;
  }
  function fitKeyboard() {
    if (!vv) return;
    var kbOpen = (window.innerHeight - vv.height > 120) && isEditing();
    if (kbOpen) {
      page.classList.add('kb');
      page.style.minHeight = '0';
      page.style.height = Math.max(300, vv.height) + 'px';
    } else if (page.classList.contains('kb')) {
      page.classList.remove('kb');
      page.style.minHeight = '';
      page.style.height = '';
    }
  }
  if (vv) {
    vv.addEventListener('resize', fitKeyboard);
    window.addEventListener('resize', fitKeyboard);
  }

  /* ---------- 启动 ---------- */
  applyWrap();
  updateStats();
  syncGutter();
  syncScroll();
  if (window.matchMedia && matchMedia('(pointer: fine)').matches) txt.focus();
})();
</script>
</body>
</html>
